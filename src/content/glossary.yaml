# Bugwise glossary. One entry per term. See CONTENT_GUIDE.md for the format.
# `id` is used by <Term id="..."> across the site, so never rename an existing id.

# ---------------------------------------------------------------------------
# Process
# ---------------------------------------------------------------------------

- id: software-testing
  term: Software testing
  short: "Checking that software does what it should, and finding problems before real users do."
  definition: >-
    Software testing is the process of evaluating an app or website to find defects and to check
    that it meets its requirements and the needs of its users. It includes running the software
    (dynamic testing) and also reviewing documents and designs (static testing). Testing cannot
    prove there are no bugs, but it reduces the risk that serious ones reach users.
  example: >-
    Before a food delivery app is released, a tester places orders, changes addresses, cancels
    orders and pays with different cards to see whether anything breaks or behaves unexpectedly.
  category: process
  aka: [Testing, QA testing]
  related: [quality-assurance, quality-control, bug, test-case]

- id: quality-assurance
  term: Quality assurance
  short: "Activities that improve the process of building software so fewer defects get made in the first place."
  definition: >-
    Quality assurance (QA) is process-oriented: it focuses on how the team works so that quality
    is built in from the start. It includes things like defining standards, reviewing requirements,
    agreeing on a definition of done and improving workflows. In everyday job titles, "QA" is often
    used loosely to mean testing.
  example: >-
    A team decides that every user story must have acceptance criteria before development starts,
    so developers and testers share the same understanding of "done".
  category: process
  aka: [QA]
  related: [quality-control, software-testing, acceptance-criteria]

- id: quality-control
  term: Quality control
  short: "Checking the finished product for defects; testing is the main quality control activity."
  definition: >-
    Quality control (QC) is product-oriented: it examines what has been built to find defects
    before it is released. Testing, inspections and reviews of the actual product are QC activities.
    QA tries to prevent defects, QC tries to detect them.
  example: >-
    A tester runs the checkout test cases on the new build of a shopping app and reports that the
    discount code field rejects valid codes.
  category: process
  aka: [QC]
  related: [quality-assurance, software-testing]

- id: test-case
  term: Test case
  short: "A written set of steps, data and an expected result used to check one specific behavior."
  definition: >-
    A test case describes exactly how to test one thing: preconditions, steps, test data and the
    expected result. Anyone on the team should be able to follow it and get the same outcome. Good
    test cases are specific, independent and easy to repeat.
  example: >-
    "TC-012: Log in with a valid email and wrong password. Expected: an error message 'Incorrect
    email or password' is shown and the user stays on the login screen."
  category: process
  related: [test-scenario, test-suite, expected-result, precondition, test-data]

- id: test-scenario
  term: Test scenario
  short: "A high-level idea of what to test, such as 'User resets a forgotten password'."
  definition: >-
    A test scenario is a one-line description of a situation or user journey worth testing. It says
    what to test, not exactly how. One scenario usually becomes several detailed test cases.
  example: >-
    Scenario "User adds an item to the cart" could become test cases for adding one item, adding the
    same item twice, adding an out-of-stock item, and adding while offline.
  category: process
  related: [test-case, test-suite, user-story]

- id: test-suite
  term: Test suite
  short: "A group of related test cases that are run together."
  definition: >-
    A test suite is a collection of test cases organized around a feature, a type of testing or a
    goal. Grouping tests makes it easy to plan, run and report on them together.
  example: >-
    A "Payments" suite in a banking app contains all test cases for card payments, transfers and
    payment history, and is run before every release.
  category: process
  related: [test-case, regression-testing, smoke-testing]

- id: test-plan
  term: Test plan
  short: "A document describing what will be tested, how, by whom, when, and what 'done' means."
  definition: >-
    A test plan describes the scope, approach, resources, schedule, environments, risks and
    entry/exit criteria for testing a specific project or release. It keeps everyone aligned on
    what will and will not be tested. In agile teams it is often short and lives in a wiki page.
  example: >-
    The test plan for a new app release says: test on iOS 17-18 and Android 13-15, focus on the new
    checkout, skip the legacy loyalty screen, and stop testing when no open critical bugs remain.
  category: process
  related: [test-strategy, stlc, test-coverage]

- id: test-strategy
  term: Test strategy
  short: "The high-level, long-term approach to testing used across a company or product."
  definition: >-
    A test strategy sets out the general principles of how testing is done: which levels and types
    of testing are used, what is automated, which tools and environments are standard, and how risk
    is handled. It is broader and more stable than a test plan, which applies it to one project.
  example: >-
    A company's mobile test strategy says that every release gets automated unit tests, a manual
    smoke test on five real devices and exploratory testing of new features.
  category: process
  related: [test-plan, test-coverage]

- id: checklist
  term: Checklist
  short: "A simple list of things to check, lighter and faster to use than full test cases."
  definition: >-
    A checklist is a list of items or conditions a tester verifies, without detailed steps or
    expected results for each one. It relies on the tester's knowledge and is great for quick
    checks, repeated reviews and areas that change often.
  example: >-
    A login screen checklist: password is masked, show/hide toggle works, error appears for wrong
    password, keyboard type is email for the email field, 'Forgot password' link opens.
  category: process
  related: [test-case, smoke-testing]

- id: test-data
  term: Test data
  short: "The input values, accounts and records you use while testing."
  definition: >-
    Test data is any data needed to run a test: usernames, passwords, card numbers, product IDs,
    files to upload and so on. Good test data covers valid, invalid and unusual values, and never
    uses real customers' personal information.
  example: >-
    For a sign-up form you might prepare emails like anna@test.com (valid), anna@test (invalid) and
    a 254-character email (boundary).
  category: process
  related: [test-case, precondition, boundary-value-analysis]

- id: precondition
  term: Precondition
  short: "Something that must already be true before you can start a test."
  definition: >-
    A precondition is the state the system, data or device must be in before a test case begins.
    Writing preconditions down makes tests repeatable and stops confusion about why a test failed.
  example: >-
    "User is logged in and has at least one item in the cart" is a precondition for testing the
    checkout screen.
  category: process
  related: [test-case, test-data]

- id: expected-result
  term: Expected result
  short: "What should happen when you perform a test step, according to the requirements."
  definition: >-
    The expected result is the correct behavior you expect to see, based on requirements, designs or
    common sense. You compare it with the actual result to decide whether a test passes or fails. It
    should be specific enough that two testers would judge it the same way.
  example: >-
    After tapping "Save" on the profile screen, the expected result is a toast saying "Profile saved"
    and the new name shown at the top.
  category: process
  related: [actual-result, test-case, bug-report]

- id: actual-result
  term: Actual result
  short: "What really happened when you performed the test."
  definition: >-
    The actual result is the behavior you observed while testing. If it differs from the expected
    result, you have found a possible bug. In a bug report, describe it precisely, including error
    messages and screenshots.
  example: >-
    Expected: the cart shows 2 items. Actual: the cart badge shows 2 but the cart screen lists only 1
    item.
  category: process
  related: [expected-result, bug-report]

- id: sdlc
  term: Software development life cycle
  short: "The stages software goes through, from idea and requirements to release and maintenance."
  definition: >-
    The software development life cycle (SDLC) describes the phases of building software, typically
    requirements, design, development, testing, deployment and maintenance. Models such as Waterfall,
    V-model and Agile arrange these phases differently. Testing should start early in the SDLC, not
    only at the end.
  example: >-
    A team building a fitness app gathers requirements, designs the screens, codes the features,
    tests them, publishes to the app stores and then fixes bugs reported by users.
  category: process
  aka: [SDLC]
  related: [stlc, agile, requirement]

- id: stlc
  term: Software testing life cycle
  short: "The phases of testing work, from analyzing requirements to closing the test cycle."
  definition: >-
    The software testing life cycle (STLC) is the sequence of testing activities: requirement
    analysis, test planning, test case design, test environment setup, test execution and test
    closure. Each phase has its own inputs and outputs. It runs alongside the SDLC.
  example: >-
    For a new "Pay with Apple Pay" feature, a tester reviews the requirements, plans which devices to
    use, writes test cases, prepares a test environment, runs the tests and finally writes a summary
    report.
  category: process
  aka: [STLC]
  related: [sdlc, test-plan, test-case]

- id: requirement
  term: Requirement
  short: "A statement of what the software must do or how well it must do it."
  definition: >-
    A requirement describes a capability or condition the product must have. Functional requirements
    describe behavior ("users can reset their password"), non-functional ones describe qualities ("the
    home screen loads in under 2 seconds"). Testers check requirements are clear and testable.
  example: >-
    "The password must be at least 8 characters and contain one number" is a requirement you can turn
    directly into test cases.
  category: process
  related: [acceptance-criteria, user-story, traceability-matrix]

- id: traceability-matrix
  term: Traceability matrix
  short: "A table linking each requirement to the test cases that cover it."
  definition: >-
    A requirements traceability matrix (RTM) maps requirements to test cases, and often to test
    results and bugs. It shows at a glance which requirements are tested, which are not, and what is
    affected when a requirement changes.
  example: >-
    Requirement REQ-07 "User can change language" maps to TC-31, TC-32 and TC-33. If REQ-07 has no
    test cases, the gap is obvious.
  category: process
  aka: [RTM, Requirements traceability matrix]
  related: [requirement, test-coverage, test-case, test-run, impact-analysis]

- id: test-coverage
  term: Test coverage
  short: "How much of the product, requirements or risks your tests actually check."
  definition: >-
    Test coverage measures the extent to which something has been exercised by tests. For manual
    testers it usually means requirement coverage (how many requirements have tests) or feature,
    device and browser coverage. High coverage reduces risk but never guarantees zero bugs.
  example: >-
    You tested the checkout on Chrome and Safari but not Firefox, so your browser coverage for
    checkout is two out of three supported browsers.
  category: process
  related: [traceability-matrix, test-plan]

- id: verification
  term: Verification
  short: "Checking that we built the product right, according to its specification."
  definition: >-
    Verification checks whether a work product meets its specified requirements. It answers "Are we
    building the product right?" and includes reviews, walkthroughs and tests against the spec.
  example: >-
    The spec says the PIN field accepts exactly 4 digits. You verify that it rejects 3 and 5 digits
    and accepts 4.
  category: process
  related: [validation, requirement]

- id: validation
  term: Validation
  short: "Checking that we built the right product, one that really meets users' needs."
  definition: >-
    Validation checks whether the product fulfills its intended use and the real needs of its users.
    It answers "Are we building the right product?" A product can pass verification and still fail
    validation if the requirements were wrong.
  example: >-
    The 4-digit PIN works exactly as specified, but in user testing older customers keep forgetting
    it and ask for Face ID instead. The product is verified but not validated.
  category: process
  related: [verification, acceptance-testing, usability-testing]

- id: build
  term: Build
  short: "A specific compiled version of the app or website that is ready to be installed or tested."
  definition: >-
    A build is a version of the software produced from the source code at a certain point in time,
    usually with a number such as 2.4.0 (318). Testers always note which build they tested, because
    bugs may be fixed or introduced in a later one.
  example: >-
    The bug report says "Found in build 3.1.0 (512) on Android". The developer fixes it in build 513
    and you retest on that build.
  category: process
  aka: [Version]
  related: [environment, smoke-testing, release]

- id: environment
  term: Environment
  short: "A setup of servers, data and configuration where the software runs, such as dev, staging or production."
  definition: >-
    An environment is a complete place where the software runs, including its servers, databases,
    configuration and third-party connections. Teams usually have several, such as development,
    QA/test, staging and production, so that testing does not affect real users.
  example: >-
    You test a new payment flow in the QA environment with fake cards, so no real money moves and no
    real customers see unfinished features.
  category: process
  aka: [Test environment]
  related: [staging, production, build]

- id: staging
  term: Staging
  short: "A pre-release environment that mirrors production as closely as possible."
  definition: >-
    Staging is an environment that copies production settings, infrastructure and often realistic
    data. It is the final place to test a release before it goes live, to catch problems that only
    appear in a production-like setup.
  example: >-
    The new release passes all tests in QA, but on staging the image uploads fail because the storage
    configuration is different. Better to find it here than in production.
  category: process
  aka: [Pre-production, Pre-prod]
  related: [environment, production]

- id: production
  term: Production
  short: "The live environment that real users use."
  definition: >-
    Production is the real, live system where customers use the app or website and real data and
    money are involved. Testing in production is done carefully and in limited ways, because
    mistakes affect real people.
  example: >-
    After release, a tester does a quick check on production that the app opens, login works and the
    home screen loads, without placing real orders.
  category: process
  aka: [Prod, Live]
  related: [environment, staging]

- id: release
  term: Release
  short: "Making a version of the software available to users."
  definition: >-
    A release is the act of delivering a specific build to users, for example publishing it to the
    App Store and Google Play or deploying it to a website. Releases are often preceded by a final
    round of regression and smoke testing.
  example: >-
    Version 5.2 of a banking app is released to 10% of Android users first, and to everyone a week
    later if no serious crashes appear.
  category: process
  related: [build, production, regression-testing]

# ---------------------------------------------------------------------------
# Testing types
# ---------------------------------------------------------------------------

- id: functional-testing
  term: Functional testing
  short: "Testing what the software does, checking features against their requirements."
  definition: >-
    Functional testing checks that each feature behaves as specified: inputs produce the correct
    outputs and actions have the correct effects. It focuses on what the system does, not how fast or
    how securely it does it.
  example: >-
    Checking that tapping "Add to cart" adds the product, updates the cart badge and shows the correct
    total price.
  category: types
  related: [non-functional-testing, black-box-testing, requirement]

- id: non-functional-testing
  term: Non-functional testing
  short: "Testing how well the software works, such as speed, security, usability and accessibility."
  definition: >-
    Non-functional testing checks quality characteristics rather than specific features. It covers
    performance, security, usability, accessibility, compatibility, reliability and more. A feature
    can work correctly and still fail non-functional testing.
  example: >-
    The search works, but it takes 9 seconds to show results on a 3G connection. That is a
    non-functional (performance) problem.
  category: types
  related: [functional-testing, performance-testing, usability-testing, security-testing, accessibility-testing]

- id: smoke-testing
  term: Smoke testing
  short: "A quick check of the most important features to decide if a build is stable enough to test further."
  definition: >-
    Smoke testing is a short, broad set of tests run on a new build to confirm that the critical
    functions work at all. If the smoke test fails, the build is rejected and deeper testing does not
    start. It is wide but shallow.
  example: >-
    On a new build of a shopping app you check: the app launches, you can log in, search shows
    products, and you can open the cart. If login crashes, the build goes back to the developers.
  category: types
  aka: [Build verification testing, BVT]
  related: [sanity-testing, regression-testing, build]

- id: sanity-testing
  term: Sanity testing
  short: "A quick, focused check that a specific fix or change works and nothing obvious around it broke."
  definition: >-
    Sanity testing is a narrow, quick check done after a small change or bug fix, to decide whether it
    is reasonable to continue with more testing. It is narrow but goes a little deeper into one area,
    and is usually unscripted.
  example: >-
    Developers fixed the coupon field. You quickly apply a few coupons and check the total updates,
    before running the full checkout regression suite.
  category: types
  related: [smoke-testing, retesting, regression-testing]

- id: regression-testing
  term: Regression testing
  short: "Re-running tests to check that new changes didn't break things that used to work."
  definition: >-
    Regression testing re-tests existing features after code changes, bug fixes or updates to make
    sure nothing that worked before is now broken. Because it is repeated often, it is a common
    candidate for automation.
  example: >-
    After the team adds Google Pay to checkout, you re-run the card payment and PayPal tests to make
    sure those still work.
  category: types
  aka: [Regression]
  related: [retesting, smoke-testing, sanity-testing, test-suite]

- id: retesting
  term: Retesting
  short: "Running the same test again to confirm that a reported bug is really fixed."
  definition: >-
    Retesting means repeating the exact steps of a failed test after the developer fixes the bug, to
    confirm the fix. It targets one known defect, while regression testing looks for new, unexpected
    breakage elsewhere.
  example: >-
    You reported that the app crashes when uploading a HEIC photo. In the new build, you upload the
    same HEIC photo again to confirm it works.
  category: types
  aka: [Confirmation testing]
  related: [regression-testing, bug-life-cycle]

- id: exploratory-testing
  term: Exploratory testing
  short: "Learning, designing and running tests at the same time, guided by curiosity and a goal."
  definition: >-
    In exploratory testing the tester explores the product without detailed scripts, using what they
    learn to decide what to try next. It is structured with a goal (a charter) and a time box, and
    findings are noted as you go. It is great at finding bugs scripted tests miss.
  example: >-
    Charter: "Explore the photo editor for 30 minutes, focusing on undo and redo." You try rotating,
    cropping, undoing ten times, switching apps mid-edit and note everything odd.
  category: types
  related: [ad-hoc-testing, test-case]

- id: ad-hoc-testing
  term: Ad hoc testing
  short: "Informal testing with no plan or documentation, trying things to see what breaks."
  definition: >-
    Ad hoc testing is unplanned and unstructured: the tester tries things based on intuition and
    experience, without a charter or notes. It can find bugs quickly but is hard to repeat or measure,
    which is the main difference from exploratory testing. (Monkey testing, feeding random input, often
    with a tool, is a related idea.)
  example: >-
    While waiting for a build, you randomly tap buttons on the settings screen very fast and discover
    that two dialogs open on top of each other.
  category: types
  aka: [Informal testing]
  related: [exploratory-testing]

- id: usability-testing
  term: Usability testing
  short: "Checking how easy and pleasant the product is for real people to use."
  definition: >-
    Usability testing evaluates whether users can achieve their goals effectively, efficiently and
    with satisfaction. It often involves watching real users try tasks and noting where they get
    confused. Testers also flag usability issues they notice during normal testing.
  example: >-
    Five users are asked to change their delivery address. Three of them cannot find the option
    because it is hidden inside "Account > Other".
  category: types
  related: [accessibility-testing, non-functional-testing, validation, usability-heuristics, think-aloud]

- id: compatibility-testing
  term: Compatibility testing
  short: "Checking the product works across different devices, OS versions, browsers and screen sizes."
  definition: >-
    Compatibility testing checks that the software works correctly in different environments: device
    models, operating system versions, browsers, screen sizes and network types. It matters a lot in
    mobile because of fragmentation.
  example: >-
    The sign-up button is cut off on a small Android phone with Android 11, but looks fine on a Pixel
    8 with Android 15.
  category: types
  related: [cross-browser-testing, fragmentation, real-device, responsive-design]

- id: accessibility-testing
  term: Accessibility testing
  short: "Checking that people with disabilities can use the product, for example with a screen reader."
  definition: >-
    Accessibility testing checks that everyone, including people with visual, hearing, motor or
    cognitive impairments, can use the app or site. It covers screen reader support, color contrast,
    text scaling, keyboard navigation and touch target size, often measured against WCAG.
  example: >-
    With VoiceOver on, the "Pay" button is announced only as "Button", so a blind user cannot tell
    what it does.
  category: types
  aka: [a11y testing]
  related: [screen-reader, dynamic-type, touch-target, wcag, usability-testing]

- id: performance-testing
  term: Performance testing
  short: "Checking how fast, stable and responsive the software is under different loads."
  definition: >-
    Performance testing measures speed, responsiveness and stability, for example load times, memory
    use and behavior with many users. It includes load testing and stress testing, which usually need
    tools. Manual testers still notice slow screens, lag and battery drain.
  example: >-
    A news website loads in 1.5 seconds normally, but during a big event with thousands of visitors it
    takes 20 seconds or fails.
  category: types
  related: [non-functional-testing, load-testing, stress-testing]

- id: security-testing
  term: Security testing
  short: "Checking that data and features are protected from unauthorized access and attacks."
  definition: >-
    Security testing looks for weaknesses that could let attackers steal data, take over accounts or
    misuse the system. Manual testers can check basics such as session timeout, access to other users'
    data and how sensitive data is shown or stored.
  example: >-
    You change the order ID in the URL from /orders/1001 to /orders/1002 and can see another customer's
    order. That is a serious security bug.
  category: types
  related: [non-functional-testing, negative-testing]

- id: cross-browser-testing
  term: Cross-browser testing
  short: "Checking a website works and looks right in different browsers and browser versions."
  definition: >-
    Cross-browser testing verifies a website on the browsers its users actually use, such as Chrome,
    Safari, Firefox and Edge, on desktop and mobile. Browsers render pages and support features
    slightly differently, so layouts and features can break in only one of them.
  example: >-
    A date picker works in Chrome but shows a plain text field in Safari on iPhone, so users cannot
    pick a date.
  category: web
  related: [compatibility-testing, responsive-design, devtools]

- id: unit-testing
  term: Unit testing
  short: "Testing the smallest pieces of code, like a single function, usually by developers."
  definition: >-
    Unit testing checks individual units of code, such as a function or class, in isolation. It is
    the first test level, almost always automated and written by developers. Fast unit tests catch
    many bugs before testers ever see the build.
  example: >-
    A developer writes an automated test checking that the function calculateTotal() returns 25.00
    for two items priced 10.00 and 15.00.
  category: types
  aka: [Component testing]
  related: [integration-testing, white-box-testing]

- id: integration-testing
  term: Integration testing
  short: "Testing that different parts of the system work correctly together."
  definition: >-
    Integration testing checks the interfaces and interactions between components or systems, such as
    the app and its backend API, or the app and a payment provider. Many bugs hide in the gaps between
    pieces that each work fine on their own.
  example: >-
    The app and the payment service both work alone, but when combined the app sends the price in
    euros while the service expects cents, so a 10 euro order is charged 0.10.
  category: types
  related: [unit-testing, system-testing, api]

- id: system-testing
  term: System testing
  short: "Testing the complete, integrated product as a whole against its requirements."
  definition: >-
    System testing evaluates the whole application end to end, in an environment close to production.
    It covers both functional and non-functional requirements and is where most manual testers spend
    their time.
  example: >-
    You test the full journey in a travel app: search a flight, choose seats, pay, receive the
    confirmation email and see the booking in "My trips".
  category: types
  related: [integration-testing, acceptance-testing]

- id: acceptance-testing
  term: Acceptance testing
  short: "Testing whether the product is ready to be accepted by the customer, users or business."
  definition: >-
    Acceptance testing is the final test level, checking whether the system meets business needs and
    acceptance criteria so it can be released. It may be done by users (UAT), the product owner or the
    customer.
  example: >-
    Before launch, the product owner goes through every acceptance criterion of the new loyalty points
    feature and signs it off.
  category: types
  related: [uat, system-testing, acceptance-criteria, validation]

- id: uat
  term: User acceptance testing
  short: "Real users or business people checking the product meets their needs before release."
  definition: >-
    User acceptance testing (UAT) is acceptance testing done by the intended users or their
    representatives, using realistic scenarios. Its goal is to confirm the product is fit for real use,
    not to find small technical bugs.
  example: >-
    Branch staff at a bank use the new internal app for a week to process real-looking requests and
    confirm it supports their daily work.
  category: types
  aka: [UAT, End-user testing]
  related: [acceptance-testing, validation]

# ---------------------------------------------------------------------------
# Techniques
# ---------------------------------------------------------------------------

- id: black-box-testing
  term: Black-box testing
  short: "Testing based only on inputs and outputs, without looking at the code."
  definition: >-
    In black-box testing the tester treats the software as a closed box and designs tests from
    requirements and behavior, not from the code. Techniques like equivalence partitioning and
    boundary value analysis are black-box techniques. Most manual testing is black-box.
  example: >-
    You test a login screen by entering valid and invalid credentials and checking the results, with
    no idea how the login code is written.
  category: techniques
  aka: [Specification-based testing, Behavioral testing]
  related: [white-box-testing, grey-box-testing, equivalence-partitioning]

- id: white-box-testing
  term: White-box testing
  short: "Testing based on knowledge of the internal code and logic."
  definition: >-
    White-box testing designs tests from the internal structure of the code, for example making sure
    every branch of an if-statement runs. It is mostly done by developers, often through unit tests.
  example: >-
    A developer sees the discount code has three branches (expired, valid, already used) and writes a
    test for each one.
  category: techniques
  aka: [Structural testing, Glass-box testing]
  related: [black-box-testing, grey-box-testing, unit-testing]

- id: grey-box-testing
  term: Grey-box testing
  short: "Testing from the outside with some knowledge of the inside, like the database or API."
  definition: >-
    Grey-box testing combines both views: you test through the user interface but use partial
    knowledge of internals, such as API calls, database tables or logs, to design better tests and
    confirm results.
  example: >-
    After changing your email in the app, you check in DevTools that the API request sent the new
    email and returned a 200 response.
  category: techniques
  related: [black-box-testing, white-box-testing, api, devtools]

- id: positive-testing
  term: Positive testing
  short: "Testing with valid input to confirm the software works as expected."
  definition: >-
    Positive testing checks that the system does what it should when the user does things correctly.
    It confirms the happy path works before you start trying to break it.
  example: >-
    Entering a valid email and a strong password on the sign-up screen creates the account and opens
    the welcome screen.
  category: techniques
  aka: [Happy path testing]
  related: [negative-testing, edge-case]

- id: negative-testing
  term: Negative testing
  short: "Testing with invalid or unexpected input to check the software handles it gracefully."
  definition: >-
    Negative testing checks how the system behaves when users enter wrong data or do unexpected
    things. The software should show clear errors and never crash, lose data or accept bad input.
  example: >-
    Entering letters in a phone number field, or pasting a 5,000-character comment, should show a
    helpful message rather than crash the app.
  category: techniques
  related: [positive-testing, edge-case, boundary-value-analysis]

- id: edge-case
  term: Edge case
  short: "An unusual situation at the extreme of what the software should handle."
  definition: >-
    An edge case is a rare or extreme condition, such as the minimum or maximum value, an empty list,
    a very long name, no network, or a date like 29 February. Edge cases are where many bugs hide
    because developers often do not think of them.
  example: >-
    A user named "Oluwaseun Adebayo-Williamson" has a name so long that it overlaps the logout button
    on the profile screen.
  category: techniques
  aka: [Corner case]
  related: [boundary-value-analysis, negative-testing, truncation]

- id: equivalence-partitioning
  term: Equivalence partitioning
  short: "Splitting inputs into groups that should behave the same, then testing one value from each group."
  definition: >-
    Equivalence partitioning divides input data into partitions (classes) where every value should be
    treated the same way by the software. Testing one representative value per partition gives good
    coverage with few tests. It covers both valid and invalid partitions.
  example: >-
    An age field accepts 18-60. Partitions are below 18 (invalid), 18-60 (valid) and above 60
    (invalid), so you might test 10, 35 and 75.
  category: techniques
  aka: [Equivalence class partitioning, ECP]
  related: [boundary-value-analysis, black-box-testing, test-data]

- id: boundary-value-analysis
  term: Boundary value analysis
  short: "Testing values at and just around the edges of valid ranges, where bugs love to hide."
  definition: >-
    Boundary value analysis (BVA) tests the values at the edges of each partition, because developers
    often make off-by-one mistakes there (using < instead of <=). You test the boundary itself and
    the value just outside it.
  example: >-
    For an age field accepting 18-60, test 17, 18, 60 and 61 (and often 19 and 59 too).
  category: techniques
  aka: [BVA]
  related: [equivalence-partitioning, edge-case]

- id: decision-table
  term: Decision table
  short: "A table listing combinations of conditions and the action the software should take for each."
  definition: >-
    Decision table testing captures business rules with several conditions in a table, where each
    column is one combination of conditions and the expected outcome. It helps you avoid missing
    combinations.
  example: >-
    Free shipping rules: is the user a member (yes/no) and is the order over 50 euros (yes/no)? The
    table shows all four combinations and whether shipping is free for each.
  category: techniques
  related: [state-transition-testing, equivalence-partitioning]

- id: state-transition-testing
  term: State transition testing
  short: "Testing how the system moves between states, like Locked, Active and Suspended."
  definition: >-
    State transition testing models the system as states and the events that move it between them,
    then tests valid and invalid transitions. It suits features where the same action has different
    results depending on the current state.
  example: >-
    After three wrong PINs a banking app goes from "Active" to "Locked". You test that a fourth attempt
    stays locked, and that resetting the PIN moves it back to "Active".
  category: techniques
  related: [decision-table, bug-life-cycle]

# ---------------------------------------------------------------------------
# Bugs
# ---------------------------------------------------------------------------

- id: bug
  term: Bug
  short: "A problem in the software that makes it behave differently from what is expected."
  definition: >-
    A bug is the everyday word for a defect: a flaw that causes the software to behave incorrectly or
    differently from requirements or reasonable user expectations. Bugs range from typos to crashes
    and data loss.
  example: >-
    In a weather app, the temperature shows in Fahrenheit even though the user selected Celsius in
    settings.
  category: bugs
  aka: [Issue]
  related: [defect, error, failure, bug-report]

- id: defect
  term: Defect
  short: "A flaw in the code or documentation that can make the software fail."
  definition: >-
    A defect is an imperfection in a work product, usually code, that does not meet its requirements.
    Defects are caused by human errors, and when the faulty code runs it may cause a failure. "Bug"
    and "defect" are used interchangeably in practice.
  example: >-
    The developer wrote "if (age > 18)" instead of "if (age >= 18)", so 18-year-olds cannot sign up.
    That line of code is the defect.
  category: bugs
  aka: [Fault]
  related: [error, failure, bug]

- id: error
  term: Error
  short: "A human mistake, such as misunderstanding a requirement, that introduces a defect."
  definition: >-
    In testing vocabulary, an error is a mistake made by a person, for example a developer typing the
    wrong condition or an analyst writing an unclear requirement. Errors lead to defects in the
    product, which may then cause failures.
  example: >-
    A developer misreads "minimum 8 characters" as "maximum 8 characters". That misunderstanding is the
    error.
  category: bugs
  aka: [Mistake]
  related: [defect, failure]

- id: failure
  term: Failure
  short: "When the software visibly does something wrong while it is running."
  definition: >-
    A failure is an event where the system does not do what it should, observed by a user or tester.
    It happens when defective code is executed. Not every defect causes a failure, for example if the
    faulty code is never reached.
  example: >-
    The user taps "Pay" and the app crashes. The crash is the failure caused by a defect in the payment
    code.
  category: bugs
  related: [error, defect, crash]

- id: bug-report
  term: Bug report
  short: "A clear written description of a bug so developers can reproduce and fix it."
  definition: >-
    A bug report documents a defect with a short title, environment and build, steps to reproduce,
    expected result, actual result, severity, priority and evidence such as screenshots or videos. A
    good report lets a developer reproduce the bug without asking any questions.
  example: >-
    Title: "Checkout: app crashes when tapping Pay with an expired card (Android 14, build 4.2.1)",
    followed by numbered steps, expected and actual results and a screen recording.
  category: bugs
  aka: [Defect report, Ticket]
  related: [severity, priority, reproducible, expected-result, actual-result]

- id: severity
  term: Severity
  short: "How much damage a bug does to the product or the user."
  definition: >-
    Severity describes the impact of a bug on the system or user: for example blocker or critical
    (crash, data loss, no workaround), major, minor or trivial (cosmetic). The tester usually proposes
    it, and it is confirmed or adjusted in triage. It is independent of how soon the bug will be fixed.
  example: >-
    The app crashes on launch for all users: critical severity. A slightly misaligned icon: low
    severity.
  category: bugs
  related: [priority, bug-report, blocker]

- id: priority
  term: Priority
  short: "How soon a bug should be fixed, based on business needs."
  definition: >-
    Priority describes the urgency of fixing a bug, for example P1 (Highest) to P4 (Low), or simply
    high, medium and low. It is typically decided by the product owner or team lead, considering
    business impact, deadlines and how many users are affected. A low-severity bug can still be high
    priority.
  example: >-
    The company logo is misspelled on the home page. Severity is low (nothing breaks), but priority is
    high because every visitor sees it.
  category: bugs
  related: [severity, bug-report]

- id: bug-life-cycle
  term: Bug life cycle
  short: "The statuses a bug goes through, from New to Closed."
  definition: >-
    The bug life cycle (or defect life cycle) is the set of statuses a bug moves through, such as New,
    Open, Assigned, In Progress, Fixed / Ready for test and Verified / Closed, with side paths like
    Reopened, Duplicate, Not a bug, Cannot reproduce and Deferred. The exact statuses depend on the
    team and tool.
  example: >-
    You report a bug (New), triage confirms it (Open), a developer takes it (Assigned, In Progress)
    and fixes it (Fixed), the fix reaches a test build (Ready for test), you retest it and it works, so
    you close it (Verified / Closed).
  category: bugs
  aka: [Defect life cycle]
  related: [bug-report, retesting, jira]

- id: reproducible
  term: Reproducible
  short: "A bug that happens again every time you follow the same steps."
  definition: >-
    A bug is reproducible when following specific steps reliably triggers it. Reproducible bugs are
    much easier to fix. For intermittent bugs, testers note how often it happens (for example 3 out
    of 10 tries) and any conditions that seem related.
  example: >-
    "The app crashes every time you rotate the phone while the video is loading" is reproducible.
    "It crashed once yesterday" is not yet.
  category: bugs
  aka: [Reproducible bug, Repro]
  related: [bug-report, race-condition, flaky-test]

- id: race-condition
  term: Race condition
  short: "A bug that depends on the timing or order of events, so it only happens sometimes."
  definition: >-
    A race condition happens when the result depends on which of two or more things finishes first,
    such as two network requests or a fast double tap. These bugs are often intermittent and hard to
    reproduce, so testers try fast, repeated and interrupted actions.
  example: >-
    Tapping "Place order" twice very quickly creates two orders and charges the card twice.
  category: bugs
  related: [reproducible, state-persistence]

- id: state-persistence
  term: State persistence
  short: "Whether the app remembers what the user did after navigating away, rotating, or restarting."
  definition: >-
    State persistence is the app's ability to keep data and UI state, such as form input, selected
    tabs or scroll position, across navigation, screen rotation, backgrounding or restarts. Lost state
    is a very common mobile bug.
  example: >-
    You fill in half a long form, switch to your email app to copy a code, and come back to find all
    fields empty.
  category: bugs
  related: [race-condition, segmented-control]

- id: truncation
  term: Truncation
  short: "Text that gets cut off because it doesn't fit its space."
  definition: >-
    Truncation is when text is shortened or clipped, sometimes intentionally with an ellipsis (...),
    sometimes as a bug where important information is hidden. It often appears with long names,
    translations, small screens or large text sizes.
  example: >-
    In German, the button "Save changes" becomes "Änderungen speichern" and shows as "Änderungen
    spei", with the rest cut off.
  category: ui
  related: [localization, dynamic-type, edge-case]

- id: crash
  term: Crash
  short: "When an app suddenly closes or stops working because of an unhandled error."
  definition: >-
    A crash is a failure where the app unexpectedly quits or freezes completely. Crashes are usually
    high severity. Testers report the exact steps, device, OS and build, and attach crash logs when
    available.
  example: >-
    The app closes instantly whenever you open a notification for an order that was already
    canceled.
  category: bugs
  aka: [App crash]
  related: [failure, severity, bug-report]

- id: blocker
  term: Blocker
  short: "A bug so serious that it stops testing or a release from continuing."
  definition: >-
    A blocker is the highest severity level: the bug prevents a key feature from working or blocks
    further testing, and there is no workaround. Blockers usually must be fixed before anything is
    released.
  example: >-
    Nobody can log in on the new build, so none of the other features can be tested at all.
  category: bugs
  aka: [Showstopper]
  related: [severity, priority, smoke-testing]

- id: flaky-test
  term: Flaky test
  short: "A test that sometimes passes and sometimes fails without any change to the code."
  definition: >-
    A flaky test gives inconsistent results on the same build, often because of timing, network or
    test data issues. Flaky tests reduce trust in testing and should be investigated, since they
    sometimes hide real intermittent bugs.
  example: >-
    The "upload profile photo" test fails about one run in five because the upload sometimes takes
    longer than the test waits.
  category: bugs
  aka: [Intermittent test]
  related: [reproducible, race-condition]

# ---------------------------------------------------------------------------
# Agile
# ---------------------------------------------------------------------------

- id: agile
  term: Agile
  short: "A way of building software in small, frequent increments with constant feedback."
  definition: >-
    Agile is a set of values and principles for developing software iteratively, delivering small
    working pieces often and adapting to change. Testers in agile teams work alongside developers
    from the start of each feature rather than at the end of the project.
  example: >-
    Instead of releasing a whole banking app after a year, the team releases a working login and
    balance screen in month one, then adds transfers, then cards.
  category: agile
  related: [scrum, sprint, user-story, sdlc]

- id: scrum
  term: Scrum
  short: "A popular agile framework where a team works in short sprints with fixed roles and meetings."
  definition: >-
    Scrum organizes work into sprints, with roles (product owner, scrum master, developers including
    testers) and events (sprint planning, daily scrum, sprint review, retrospective). Work is pulled
    from a prioritized product backlog.
  example: >-
    Every morning the team has a 15-minute daily scrum where the tester mentions that the new filter
    screen is blocked by a crash.
  category: agile
  related: [agile, sprint, user-story]

- id: sprint
  term: Sprint
  short: "A short, fixed period (often two weeks) in which a team builds and tests a set of work."
  definition: >-
    A sprint is a time-boxed iteration in Scrum, usually one to four weeks, at the end of which the
    team should have a potentially releasable increment. Testing happens during the sprint, not after
    it.
  example: >-
    In a two-week sprint the team commits to "Save favorite stores" and "Dark mode toggle", and both
    must be developed and tested by the sprint review.
  category: agile
  aka: [Iteration]
  related: [scrum, agile, user-story]

- id: user-story
  term: User story
  short: "A short description of a feature from the user's point of view."
  definition: >-
    A user story describes a small piece of value in the form "As a [type of user], I want [goal] so
    that [reason]." It is a placeholder for a conversation and is completed by acceptance criteria
    that say when it is done.
  example: >-
    "As a shopper, I want to save items to a wishlist so that I can buy them later."
  category: agile
  aka: [Story]
  related: [acceptance-criteria, requirement, sprint]

- id: acceptance-criteria
  term: Acceptance criteria
  short: "Conditions a user story must meet to be considered done and accepted."
  definition: >-
    Acceptance criteria are specific, testable conditions attached to a user story. They define the
    boundaries of the feature and are a direct source of test cases. They are often written as
    Given / When / Then.
  example: >-
    "Given I am logged in, when I tap the heart icon on a product, then the product appears in my
    wishlist and the icon turns red."
  category: agile
  aka: [AC]
  related: [user-story, requirement, acceptance-testing]

# ---------------------------------------------------------------------------
# Tools
# ---------------------------------------------------------------------------

- id: jira
  term: Jira
  short: "A popular tool for tracking bugs, user stories and tasks."
  definition: >-
    Jira, made by Atlassian, is a widely used issue tracker where teams manage user stories, tasks and
    bugs on boards and backlogs. Testers use it to file bug reports, follow the bug life cycle and link
    bugs to stories. Similar tools include Linear, Azure DevOps and YouTrack.
  example: >-
    You create a Jira ticket of type "Bug", fill in steps, expected and actual results, attach a video
    and link it to the story "Wishlist".
  category: tools
  related: [bug-report, bug-life-cycle, scrum]

- id: devtools
  term: DevTools
  short: "Developer tools built into browsers for inspecting pages, network traffic and errors."
  definition: >-
    Browser developer tools (in Chrome, Firefox, Safari and Edge) let you inspect HTML and CSS, see
    console errors, watch network requests, simulate devices and throttle the connection. They are
    very useful for testers to gather evidence for bug reports.
  example: >-
    The "Submit" button does nothing. In DevTools you open the Console and see a red JavaScript error,
    and in Network you see the request returned a 500 error. Both go in the bug report.
  category: tools
  aka: [Developer tools, Browser dev tools, Inspector]
  related: [api, cross-browser-testing, grey-box-testing, responsive-design]

- id: api
  term: API
  short: "The way different software parts talk to each other, like an app asking a server for data."
  definition: >-
    An API (application programming interface) is a defined set of requests and responses that lets
    one program use another. Mobile apps and websites usually call backend APIs to log in, load data
    and save changes. Testers can check API calls with DevTools or tools like Postman.
  example: >-
    When you open your orders in a shopping app, the app sends a request to an API like
    GET /api/orders and shows the list it gets back.
  category: tools
  aka: [Application programming interface]
  related: [integration-testing, devtools, grey-box-testing]

- id: emulator
  term: Emulator
  short: "Software that imitates a real device's hardware and OS on your computer, like the Android Emulator."
  definition: >-
    An emulator mimics both the hardware and operating system of a device, so you can run a mobile app
    on a computer. The Android Emulator in Android Studio is the most common example. It is free and
    convenient but does not perfectly match real devices in performance, sensors or manufacturer
    customizations.
  example: >-
    You quickly check a layout on a Pixel 4 and a Pixel Tablet using Android emulators before testing
    on the real phones in the office.
  category: mobile
  aka: [Android Emulator]
  related: [simulator, real-device, fragmentation]

- id: simulator
  term: Simulator
  short: "Software that imitates a device's behavior on your computer, like Apple's iOS Simulator."
  definition: >-
    A simulator imitates the software environment of a device without copying its hardware. The iOS
    Simulator in Xcode runs iOS apps on a Mac. It is fast and useful for layout and flows, but cannot
    fully test things like the camera, push notifications, real performance or battery.
  example: >-
    You use the iOS Simulator to check the app on an iPhone SE and an iPhone 16 Pro Max screen size,
    then confirm camera scanning on a real iPhone.
  category: mobile
  aka: [iOS Simulator]
  related: [emulator, real-device]

- id: real-device
  term: Real device
  short: "A physical phone or tablet used for testing, as opposed to an emulator or simulator."
  definition: >-
    Testing on real devices shows how the app really behaves with actual hardware, sensors, network
    conditions, performance, battery and manufacturer customizations. Teams test on a selection of
    popular devices and may use cloud device farms for more coverage.
  example: >-
    A scrolling list is smooth on the emulator but stutters badly on a real budget Android phone with
    3 GB of RAM.
  category: mobile
  aka: [Physical device]
  related: [emulator, simulator, fragmentation]

# ---------------------------------------------------------------------------
# Mobile
# ---------------------------------------------------------------------------

- id: fragmentation
  term: Fragmentation
  short: "The huge variety of device models, screen sizes and OS versions an app must support."
  definition: >-
    Fragmentation describes the large number of different device and OS combinations in use,
    especially on Android, where many manufacturers ship different screen sizes, hardware and custom
    versions of the OS. It means testers must choose a representative set of devices to test on.
  example: >-
    The app works on Samsung and Pixel phones, but on a Xiaomi device the aggressive battery saver
    kills it in the background and notifications never arrive.
  category: mobile
  aka: [Device fragmentation]
  related: [compatibility-testing, real-device, emulator]

- id: dynamic-type
  term: Dynamic Type
  short: "The phone setting that lets users make text bigger or smaller across apps."
  definition: >-
    Dynamic Type is Apple's name for system-wide text size settings on iOS; Android has a similar font
    size and display size setting. Apps should respect it, and layouts should still work at the
    largest sizes without text being cut off or overlapping.
  example: >-
    With the largest text size enabled, the "Continue" button label wraps onto two lines and gets
    clipped, so it reads "Contin".
  category: mobile
  aka: [Font scaling, Large text, Text size]
  related: [accessibility-testing, truncation]

- id: dark-mode
  term: Dark mode
  short: "A display setting that uses light text on dark backgrounds."
  definition: >-
    Dark mode is a system or app setting that switches the UI to dark colors. Testers check that all
    screens switch correctly, text remains readable with good contrast, and no images, icons or
    hard-coded colors become invisible.
  example: >-
    In dark mode, the black logo on the login screen disappears against the dark background, and a
    help text stays dark grey on black.
  category: ui
  aka: [Dark theme, Night mode]
  related: [accessibility-testing, compatibility-testing]

- id: localization
  term: Localization
  short: "Adapting an app to a language and region, including translations, dates, currency and layout."
  definition: >-
    Localization (L10n) adapts a product for a specific market: translated text, date and number
    formats, currencies, and right-to-left layout for languages like Arabic. Testers check that
    translations fit, nothing is left untranslated and formats are correct. It builds on
    internationalization (i18n), which prepares the code so localization is possible at all.
  example: >-
    In the French version, prices show as "1 299,00 €" and dates as 12/10/2026, but one button still
    says "Cancel" in English.
  category: ui
  aka: [L10n]
  related: [truncation, compatibility-testing, internationalization, locale]

- id: push-notification
  term: Push notification
  short: "A message an app sends to the device that appears even when the app is closed."
  definition: >-
    Push notifications are alerts delivered by a server to a mobile device (or browser). Testers check
    permission prompts, delivery when the app is in the foreground, background or closed, the content,
    and that tapping the notification opens the right screen.
  example: >-
    Tapping a "Your order has shipped" notification should open that order's tracking screen, not just
    the home screen.
  category: mobile
  aka: [Push, Notification]
  related: [deep-link, real-device]

- id: deep-link
  term: Deep link
  short: "A link that opens a specific screen inside an app instead of just its home screen."
  definition: >-
    A deep link is a URL that takes the user directly to specific content in an app, for example a
    product page. Testers check deep links when the app is installed, not installed, logged out and
    already open.
  example: >-
    A link shop.example.com/product/123 shared in a chat should open product 123 in the shopping app,
    or the website if the app is not installed.
  category: mobile
  related: [push-notification, universal-link, deferred-deep-link]

- id: gesture
  term: Gesture
  short: "A touch action such as tap, long press, swipe, pinch or drag."
  definition: >-
    Gestures are the ways users interact with touch screens. Testers check that each supported gesture
    works, does not conflict with system gestures (like swipe-back on iOS) and has an alternative for
    users who cannot perform it.
  example: >-
    Swiping left on an email to delete it also triggers the iOS back gesture when the swipe starts near
    the screen edge.
  category: mobile
  related: [touch-target, accessibility-testing]

# ---------------------------------------------------------------------------
# UI
# ---------------------------------------------------------------------------

- id: segmented-control
  term: Segmented control
  short: "A row of connected buttons where exactly one option is selected at a time."
  definition: >-
    A segmented control is a horizontal set of two to five segments that act as one control, with one
    segment selected at a time. It switches between views or filters of related content. Its options
    are mutually exclusive.
  example: >-
    An activity screen in a fitness app has a segmented control with "Day | Week | Month" that changes
    the chart below.
  category: ui
  aka: [Segmented button, Toggle button group]
  related: [mutually-exclusive, state-persistence, touch-target]

- id: mutually-exclusive
  term: Mutually exclusive
  short: "Options where choosing one automatically means the others can't be chosen."
  definition: >-
    Options are mutually exclusive when only one can be selected at a time. Radio buttons and segmented
    controls work this way. Testers check that selecting one option always deselects the previous one
    and that it is never possible to have zero or two selected (unless designed).
  example: >-
    In a shipping options list, choosing "Express" must deselect "Standard". If both look selected,
    that is a bug.
  category: ui
  related: [segmented-control]

- id: touch-target
  term: Touch target
  short: "The area of the screen that responds to a tap, which should be large enough for a finger."
  definition: >-
    A touch target is the tappable area of a control, which can be larger than the visible icon.
    Guidelines recommend at least 44x44 points on iOS and 48x48 dp on Android; on the web, WCAG 2.5.8
    asks for at least 24x24 CSS pixels (44x44 is the comfortable target). Small or overlapping
    targets cause mis-taps and accessibility problems.
  example: >-
    The small "x" to close a banner is only 16 pixels wide, so users keep tapping the ad behind it
    instead.
  category: ui
  aka: [Tap target, Hit area]
  related: [accessibility-testing, gesture, segmented-control]

- id: screen-reader
  term: Screen reader
  short: "Software that reads the screen aloud for blind and low-vision users, like VoiceOver or TalkBack."
  definition: >-
    A screen reader converts on-screen content into speech or braille and lets users navigate with
    gestures or a keyboard. VoiceOver (iOS, macOS), TalkBack (Android) and NVDA or JAWS (Windows) are
    common. Testers check that every element has a meaningful label, role and state, in a logical
    order.
  example: >-
    With TalkBack on, an icon-only "Share" button is read as "Unlabelled button", so the user cannot
    know what it does.
  category: ui
  aka: [VoiceOver, TalkBack]
  related: [accessibility-testing, wcag]

- id: wcag
  term: WCAG
  short: "The Web Content Accessibility Guidelines, the main international standard for accessibility."
  definition: >-
    WCAG (Web Content Accessibility Guidelines) are published by the W3C and define testable success
    criteria at levels A, AA and AAA. Most laws and companies target level AA. Although written for
    the web, they are also widely applied to mobile apps.
  example: >-
    WCAG AA requires a contrast ratio of at least 4.5:1 for normal text, so light grey text on a white
    background often fails.
  category: web
  aka: [Web Content Accessibility Guidelines]
  related: [accessibility-testing, screen-reader]

# ---------------------------------------------------------------------------
# Web
# ---------------------------------------------------------------------------

- id: responsive-design
  term: Responsive design
  short: "A website layout that adapts to different screen sizes, from phones to large monitors."
  definition: >-
    Responsive design means the same website rearranges and resizes its content to fit the screen,
    using flexible layouts and breakpoints. Testers check layouts at many widths, in portrait and
    landscape, and look for overlapping, hidden or overflowing content.
  example: >-
    On a 375-pixel-wide phone screen, the desktop navigation should collapse into a hamburger menu
    instead of overflowing off the side of the page.
  category: web
  aka: [Responsive web design, RWD]
  related: [viewport, cross-browser-testing, devtools]

- id: viewport
  term: Viewport
  short: "The visible area of a web page in the browser window or on the device screen."
  definition: >-
    The viewport is the part of the page currently visible to the user. Its width determines which
    responsive layout is shown. In DevTools you can change the viewport size to simulate different
    devices.
  example: >-
    At a viewport width of 768 pixels the product grid should show two columns, and at 1280 pixels it
    should show four.
  category: web
  related: [responsive-design, devtools]

- id: cache
  term: Cache
  short: "Stored copies of data or files that make apps and websites load faster."
  definition: >-
    A cache keeps copies of previously loaded data, such as images, scripts or API responses, so they
    do not have to be downloaded again. Stale caches can make testers see old versions, so clearing the
    cache or using a private window is a common troubleshooting step.
  example: >-
    The developer says the logo was updated, but you still see the old one until you do a hard refresh
    that bypasses the browser cache.
  category: web
  aka: [Browser cache]
  related: [cookie, devtools]

- id: cookie
  term: Cookie
  short: "A small piece of data a website stores in your browser, for example to keep you logged in."
  definition: >-
    Cookies are small pieces of text a website asks the browser to store to remember things like login
    sessions, preferences or the contents of a cart. The browser sends them back to the server with
    every request to that site. Testers check behavior with cookies cleared or
    blocked, and that consent choices are respected.
  example: >-
    After clearing cookies you are logged out of the shop and your cart is empty, which is expected.
    But if you rejected analytics cookies and they are still set, that is a bug.
  category: web
  related: [cache, devtools]

- id: button
  term: Button
  short: "A control the user taps or clicks to perform an action, like Save, Send or Buy."
  definition: >-
    A button triggers an action immediately. Buttons come in levels of emphasis (primary,
    secondary, tertiary or text) and have several states: default, hover, pressed, focused,
    disabled and loading. Testers check every state, not just the happy tap.
  example: >-
    On a checkout screen the "Place order" button should become disabled and show a spinner after
    the first tap, so a second tap can't create a duplicate order.
  category: ui
  related: [ui-state, double-submit, touch-target]

- id: ui-state
  term: UI state
  short: "How a component looks and behaves in a given situation: default, hover, pressed, focused, disabled, loading, error."
  definition: >-
    Every interactive element has several visual states. Designers define them, and developers
    often forget some. Testing each state, and the transitions between them, catches many
    visual and functional bugs.
  example: >-
    A text field has default, focused, filled, error and disabled states. If the error state
    looks identical to the default state, users won't notice their mistake.
  category: ui
  aka: [Component state, Interaction state]
  related: [button, disabled-state, loading-state]

- id: disabled-state
  term: Disabled state
  short: "A component that is visible but can't be used right now, usually shown greyed out."
  definition: >-
    A disabled control tells the user an action exists but isn't available yet, for example
    until a form is complete. It must look clearly disabled, ignore taps and keyboard input,
    and ideally make it obvious what's needed to enable it.
  example: >-
    The "Continue" button stays disabled until the user accepts the terms. A classic bug: the
    button looks grey but still submits the form when tapped.
  category: ui
  related: [ui-state, button]

- id: loading-state
  term: Loading state
  short: "What the UI shows while it waits for data or an action to finish, such as a spinner or skeleton."
  definition: >-
    Network requests take time, so apps need a loading state that tells the user something is
    happening. Testers check that it appears, that it disappears when done, that the user can't
    trigger the same action twice, and what happens if loading never finishes.
  example: >-
    On a slow 3G network, the search results screen should show a skeleton list instead of an
    empty white screen that looks broken.
  category: ui
  related: [ui-state, empty-state, double-submit]

- id: empty-state
  term: Empty state
  short: "The screen a user sees when there is no content yet, like an empty cart or no search results."
  definition: >-
    Empty states happen for new users, after filters remove everything, or when a search finds
    nothing. A good empty state explains why it's empty and what to do next. Testers
    deliberately create empty states because developers often forget them.
  example: >-
    Searching a shop for "xyzqwe" should show "No results for 'xyzqwe'" with suggestions, not a
    blank page or an endless spinner.
  category: ui
  related: [loading-state, ui-state]

- id: double-submit
  term: Double submit
  short: "A bug where an action runs twice because the user tapped or clicked twice quickly."
  definition: >-
    If a button stays active while a request is in progress, a quick double tap or a slow network
    can send the same request twice. This can create duplicate orders, payments, messages or
    accounts. Buttons should disable or ignore repeated taps while working.
  example: >-
    A user double-taps "Pay" on a slow connection and is charged twice for one order.
  category: bugs
  aka: [Double click bug, Duplicate submission]
  related: [button, race-condition, idempotency]

- id: idempotency
  term: Idempotency
  short: "An action that gives the same result no matter how many times it is repeated."
  definition: >-
    An idempotent operation can safely be repeated: doing it twice has the same effect as doing
    it once. Payment and order systems rely on this to protect users from retries, refreshes
    and double taps. Testers check it by repeating actions on purpose.
  example: >-
    Refreshing the "Order confirmed" page or tapping "Pay" twice should still result in exactly
    one order and one charge.
  category: web
  related: [double-submit, api]

- id: input-validation
  term: Input validation
  short: "Checking that what the user typed is acceptable before the app uses it."
  definition: >-
    Validation checks format, length, required fields and allowed values. It can run on the
    client (instantly, for good UX) and must also run on the server (for security). Testers
    try valid, invalid, empty, too long and unusual inputs.
  example: >-
    An email field should reject "anna@" and "anna.com" with a clear message, and accept
    "anna+shop@example.co.uk".
  category: techniques
  aka: [Form validation, Field validation]
  related: [error-message, negative-testing, boundary-value-analysis]

- id: error-message
  term: Error message
  short: "Text that tells the user something went wrong and, ideally, how to fix it."
  definition: >-
    A good error message is visible, placed next to the problem, written in plain language and
    says how to fix it. Testers check the wording, the position, that it disappears when the
    problem is fixed, and that screen readers announce it.
  example: >-
    "Password must be at least 8 characters" under the password field is helpful. "Error 422"
    at the top of the page is not.
  category: ui
  aka: [Validation message, Inline error]
  related: [input-validation, ui-state]

- id: placeholder
  term: Placeholder
  short: "Hint text shown inside an empty input field that disappears when the user starts typing."
  definition: >-
    Placeholders give an example of what to enter, such as "name@example.com". They should not
    replace a real label, because the hint vanishes as soon as the user types and is often low
    contrast. Testers check it is not mistaken for a pre-filled value.
  example: >-
    A form that uses only placeholders as labels leaves users unsure what each field was for
    once they've typed in it.
  category: ui
  aka: [Hint text]
  related: [text-field, wcag]

- id: text-field
  term: Text field
  short: "An input where the user types text, like a name, email, password or search query."
  definition: >-
    Text fields are the most common form control. They have a label, an input area, optional
    helper text, and states like focused, filled, error and disabled. Testing them covers
    validation, keyboard types, copy and paste, length limits and special characters.
  example: >-
    The phone number field on a delivery app should open the numeric keyboard and accept
    "+381 64 123 4567".
  category: ui
  aka: [Text input, Input field, Edit text]
  related: [placeholder, input-validation, error-message]

- id: dropdown
  term: Dropdown
  short: "A control that shows the selected option and opens a list of options when tapped."
  definition: >-
    Dropdowns, also called selects or pickers, save space when there are many options. On mobile
    they often open a native picker or a bottom sheet. Testers check long lists, search, default
    values, keyboard use and what happens near the screen edge.
  example: >-
    A country dropdown with 195 options should be searchable and should show the selected country
    after the user closes it.
  category: ui
  aka: [Select, Picker, Combo box]
  related: [segmented-control, modal]

- id: toggle-switch
  term: Toggle switch
  short: "An on/off control that applies a setting immediately, like Wi-Fi or Dark mode."
  definition: >-
    A toggle switch represents a binary setting that takes effect immediately, without a Save
    button. Testers check that the visual state matches the real setting, that the change
    persists, and what happens if saving the setting fails.
  example: >-
    Turning off "Push notifications" in settings should stop notifications right away and still
    show "off" after restarting the app.
  category: ui
  aka: [Switch, Toggle]
  related: [state-persistence, ui-state]

- id: modal
  term: Modal
  short: "A window that appears on top of the page and blocks the content behind it until it is closed."
  definition: >-
    Modals, or dialogs, demand attention for a decision or a short task. While open, the
    background is dimmed and not interactive. Testers check every way to close it, keyboard focus,
    scrolling behind it, and what happens on small screens or with the back button.
  example: >-
    "Delete this photo?" with Cancel and Delete is a modal. Pressing Esc on web or the Android back
    button should close it without deleting anything.
  category: ui
  aka: [Dialog, Popup]
  related: [focus-trap, toast]

- id: focus-trap
  term: Focus trap
  short: "Keeping keyboard focus inside an open modal so users can't tab into the hidden page behind it."
  definition: >-
    When a modal is open, keyboard focus should move into it, stay inside it while it is open,
    and return to the element that opened it when it closes. Without this, keyboard and screen
    reader users get lost in content they can't see.
  example: >-
    Pressing Tab repeatedly in a "Cookie settings" dialog should cycle through its buttons only,
    never reaching the links on the page underneath.
  category: web
  related: [modal, screen-reader, wcag]

- id: toast
  term: Toast
  short: "A short, temporary message that appears briefly and disappears on its own, like 'Message sent'."
  definition: >-
    Toasts (called snackbars in Material Design) confirm an action without interrupting the
    user. They disappear after a few seconds and may include one action, such as Undo. Testers
    check timing, stacking, position, readability and screen reader announcements.
  example: >-
    After archiving an email, "Conversation archived · Undo" appears at the bottom for four
    seconds. Tapping Undo should restore the email.
  category: ui
  aka: [Snackbar, Notification banner]
  related: [modal, ui-state]

- id: date-picker
  term: Date picker
  short: "A control for choosing a date, usually as a calendar grid or scrolling wheels."
  definition: >-
    Date pickers prevent typos in dates but bring their own risks: time zones, locale formats,
    leap years, disabled dates and ranges. Testers check boundaries such as month ends, Feb 29,
    past and future limits, and how dates are shown in different languages.
  example: >-
    A hotel booking app should not let the check-out date be before the check-in date, and must
    show "03/04" correctly as 3 April in the UK and March 4 in the US.
  category: ui
  aka: [Calendar picker, Date input]
  related: [time-zone, locale, boundary-value-analysis]

- id: time-zone
  term: Time zone
  short: "The local time of a region. Bugs appear when apps mix up the user's time zone with the server's."
  definition: >-
    Servers often store times in UTC while users see local time. Converting between them causes
    bugs around midnight, daylight saving changes and travel. Testers change the device time
    zone to catch them.
  example: >-
    A booking made at 23:30 in Belgrade shows up on the next day in the app because the server
    stored it in UTC and the app displayed it without converting.
  category: techniques
  aka: [Timezone, UTC offset]
  related: [date-picker, locale]

- id: locale
  term: Locale
  short: "Regional settings that control language and formats for dates, numbers and currency."
  definition: >-
    A locale combines language and region, such as en-US or sr-RS. It changes how dates (3/4 vs
    4.3.), numbers (1,000.50 vs 1.000,50) and currencies are displayed. Testers switch the
    device locale to check formatting and translations.
  example: >-
    A price shown as "1,299.00" in English should appear as "1.299,00" with a Serbian locale.
  category: process
  related: [localization, time-zone, date-picker]

- id: authentication
  term: Authentication
  short: "Checking who a user is, usually with a password, a code or biometrics."
  definition: >-
    Authentication answers "who are you?" through login, one-time codes, biometrics or social
    sign-in. Testers check correct and incorrect credentials, lockouts, sessions and how the
    app behaves when a session expires.
  example: >-
    Logging in with the right email but wrong password should show a generic error, and five
    failed attempts should temporarily lock the account.
  category: web
  aka: [Login, Sign in, AuthN]
  related: [authorization, session, two-factor-authentication]

- id: authorization
  term: Authorization
  short: "Checking what a logged-in user is allowed to see or do."
  definition: >-
    Authorization answers "what can you do?". After logging in, users should only reach their own
    data and the features their role allows. Testers try to open other users' data or admin
    pages by changing URLs or IDs.
  example: >-
    Changing /orders/1042 to /orders/1043 in the browser must not show another customer's
    order.
  category: web
  aka: [AuthZ]
  related: [authentication, security-testing]

- id: session
  term: Session
  short: "The period during which a user stays logged in without entering their credentials again."
  definition: >-
    After login the server creates a session, usually tracked with a cookie or token. Sessions
    should expire after inactivity or logout, and should not survive in ways that put the user
    at risk. Testers check expiry, logout on all devices and the back button after logout.
  example: >-
    After tapping Log out, pressing the browser back button should not show the account page
    again.
  category: web
  related: [authentication, cookie]

- id: two-factor-authentication
  term: Two-factor authentication
  short: "Logging in with two proofs, usually a password plus a one-time code."
  definition: >-
    Two-factor authentication (2FA) adds a second step, such as a one-time code sent by SMS, a
    code from an authenticator app (TOTP) or a security key. MFA (multi-factor authentication) is
    the broader term for two or more factors. Testers check expired codes, wrong codes, resending,
    pasting the code and what happens if the user loses access to the second factor.
  example: >-
    A bank app sends a 6-digit code by SMS. A code older than 5 minutes should be rejected, and
    "Resend code" should not be spammable.
  category: web
  aka: [2FA, MFA]
  related: [authentication, session, one-time-password, totp, backup-codes]

- id: debounce
  term: Debounce
  short: "Waiting until the user stops typing for a moment before reacting, for example before searching."
  definition: >-
    Instead of sending a request on every keystroke, a debounced search waits until the user
    pauses (for example 300 ms). This reduces server load and flicker. Testers type fast and
    slow, and watch the network log for extra requests and out-of-order results.
  example: >-
    Typing "headphones" should trigger one search request after you stop typing, not ten
    requests for "h", "he", "hea" and so on.
  category: web
  related: [race-condition, api]

- id: sql-injection
  term: SQL injection
  short: "An attack where text typed into a field is run as a database command."
  definition: >-
    If an app builds database queries from raw user input, an attacker can type special text that
    changes the query. Manual testers don't need to exploit it, but entering characters like a
    single quote (') into fields and reporting server errors is a useful basic check.
  example: >-
    Typing O'Brien into a name field crashes the sign-up with a database error. That's a sign the
    input isn't handled safely.
  category: web
  related: [xss, security-testing, input-validation]

- id: xss
  term: Cross-site scripting (XSS)
  short: "An attack where text a user enters is run as code in other people's browsers."
  definition: >-
    If a site shows user input without escaping it, someone can enter HTML or JavaScript that
    runs for every visitor. A basic manual check is entering text like <b>test</b> into fields
    and seeing whether it appears as bold text instead of plain characters.
  example: >-
    A product review containing <b>Great</b> shows the word in bold. The page is rendering user
    input as HTML and should be reported.
  category: web
  aka: [XSS]
  related: [sql-injection, security-testing, input-validation]

- id: payment-gateway
  term: Payment gateway
  short: "A third-party service that processes card payments for an app or website."
  definition: >-
    Apps rarely process cards themselves. They send payments to a provider like Stripe, Adyen or
    PayPal. These providers have test modes with special test card numbers for approved,
    declined and 3-D Secure payments, which testers use instead of real cards.
  example: >-
    Using the provider's "card declined" test number should show a clear payment error and keep
    the cart intact.
  category: tools
  related: [idempotency, double-submit, staging]

- id: optimistic-ui
  term: Optimistic UI
  short: "Updating the screen immediately, before the server confirms, and rolling back if the request fails."
  definition: >-
    Optimistic UI makes apps feel fast: a like, a toggle or an archive shows as done right away
    while the request runs in the background. If the server fails, the app must undo the change
    and tell the user. Testers simulate failures to check that rollback really happens.
  example: >-
    You turn off "Offers" and the switch flips instantly. On a failing network it should flip back
    with a message, not stay off while the server still has it on.
  category: ui
  aka: [Optimistic update, Rollback]
  related: [toggle-switch, loading-state, state-persistence]

- id: call-to-action
  term: Call to action (CTA)
  short: "The main button that asks the user to take the key action on a screen, like Place order or Sign up."
  definition: >-
    The CTA is the most important action on a screen and is usually the most prominent button.
    A screen should have one clear primary CTA. Testers check it is visible, reachable above the
    keyboard and not hidden by banners or sticky bars.
  example: >-
    On a product page the CTA is "Add to cart". If a cookie banner covers it on small phones, users
    can't buy anything.
  category: ui
  aka: [CTA, Primary action]
  related: [button, touch-target]

- id: off-by-one-error
  term: Off-by-one error
  short: "A bug where a count or boundary is wrong by exactly one, like counting days instead of nights."
  definition: >-
    Off-by-one errors come from mixing up "less than" and "less than or equal", or counting
    the start and end points twice. They hide at boundaries, which is exactly where boundary
    value analysis looks.
  example: >-
    A hotel stay from 20 to 21 October is shown as "2 nights" and charged twice.
  category: bugs
  related: [boundary-value-analysis, edge-case]

- id: daylight-saving-time
  term: Daylight saving time (DST)
  short: "Moving clocks forward in spring and back in autumn, creating a skipped hour and a repeated hour."
  definition: >-
    On DST change days one hour doesn't exist (spring) and one hour happens twice (autumn). Alarms,
    bookings, reminders and "24 hours later" calculations often break on those days. Testers set
    the device date and time zone to a DST change to check.
  example: >-
    A reminder set for 02:30 on the last Sunday of March never fires in Belgrade, because that time
    is skipped.
  category: techniques
  aka: [DST, Summer time]
  related: [time-zone, date-picker]

- id: diacritics
  term: Diacritics
  short: "Accent marks on letters, like é, ü, č or ž. Search usually should ignore them."
  definition: >-
    Diacritics change how text is stored and compared. Users often type without them, so a good
    search treats "cafe" and "café" as the same. Names with diacritics must also be saved and
    displayed correctly everywhere.
  example: >-
    Searching "cevapi" in a food app should still find "Ćevapi".
  category: techniques
  aka: [Accents, Accent marks]
  related: [localization, input-validation]

- id: autocomplete
  term: Autocomplete
  short: "Suggestions shown under a field while typing, which the user can pick to finish the input."
  definition: >-
    Autocomplete speeds up search and forms by suggesting queries, addresses or products. Testers
    check relevance, keyboard selection, what happens on fast typing, and that suggestions don't
    show for the wrong query.
  example: >-
    Typing "head" in a shop suggests "headphones" and "headphones wireless"; arrow keys and Enter
    should select a suggestion.
  category: ui
  aka: [Suggestions, Typeahead]
  related: [debounce, dropdown]

- id: pagination
  term: Pagination
  short: "Splitting a long list into pages that load one at a time."
  definition: >-
    Instead of loading thousands of results at once, the app loads page 1, then page 2 and so on.
    Testers look for duplicated or missing items between pages, wrong page counts and what
    happens when data changes while browsing.
  example: >-
    The last product on page 1 appears again as the first product on page 2 after sorting by price.
  category: web
  related: [infinite-scroll, api]

- id: infinite-scroll
  term: Infinite scroll
  short: "Loading more items automatically when the user reaches the bottom of a list."
  definition: >-
    Feeds and shops often use infinite scroll instead of page numbers. Testers check the loading
    indicator, the end of the list, duplicates, scroll position after going back, and behavior on
    slow networks.
  example: >-
    After opening a product and pressing Back, the list should return to the same position, not the
    top.
  category: ui
  related: [pagination, loading-state]

- id: query-parameter
  term: Query parameter
  short: "Data in a URL after the ?, like ?q=mug&sort=price, often used to keep search and filter state."
  definition: >-
    Query parameters make a page's state shareable and bookmarkable, and let Back and refresh
    restore it. They must never contain secrets such as passwords or tokens, because URLs end up
    in history and server logs.
  example: >-
    Sharing shop.com/search?q=lamp&sort=price_asc with a friend should show them the same sorted
    results.
  category: web
  aka: [URL parameter, Query string]
  related: [api, security-testing]

- id: account-enumeration
  term: Account enumeration
  short: "Finding out which emails are registered from differences in error messages or responses."
  definition: >-
    If login says "No account with this email" for one address and "Wrong password" for another,
    an attacker learns who has an account. Login, sign up and password reset should give the same
    generic response either way.
  example: >-
    "If an account exists for this email, we've sent a reset link" is safe. "This email is not
    registered" is not.
  category: web
  related: [authentication, security-testing, error-message]

- id: brute-force-attack
  term: Brute-force attack
  short: "Guessing passwords or codes over and over until one works."
  definition: >-
    Attackers automate thousands of guesses. Apps defend with lockouts, rate limiting, CAPTCHAs and
    strong password rules. Testers check that repeated wrong attempts are actually limited.
  example: >-
    Entering a wrong 6-digit SMS code 20 times in a row should be blocked long before every code
    could be tried.
  category: web
  related: [rate-limiting, authentication]

- id: rate-limiting
  term: Rate limiting
  short: "Capping how many requests a user or device can make in a period of time."
  definition: >-
    Rate limiting protects servers and accounts from abuse, such as password guessing or spamming
    "Resend code". Testers trigger the limit on purpose and check the message and the cool-down.
  example: >-
    "Resend code" becomes available again only after 30 seconds, and after five resends the user
    must wait an hour.
  category: web
  related: [brute-force-attack, two-factor-authentication]

- id: password-hashing
  term: Password hashing
  short: "Storing a one-way scrambled version of a password instead of the password itself."
  definition: >-
    Servers should never store or send plain passwords. Instead they store a hash, which can be
    checked but not reversed. A tester's clue that this is wrong: a "forgot password" email that
    contains your actual password.
  example: >-
    Requesting a password reset sends a link to set a new password, never "Your password is
    Secret123!".
  category: web
  related: [authentication, security-testing]

- id: session-token
  term: Session token
  short: "A string the server issues after login that proves who you are on later requests."
  definition: >-
    After a successful login the server returns a token (often stored in a cookie or the device's
    secure storage). Every later request sends it. Logging out should invalidate it, and it should
    expire after a while.
  example: >-
    After "Log out of all devices", a phone that was logged in should be sent back to the login
    screen on its next request.
  category: web
  aka: [Auth token]
  related: [session, authentication, cookie]

- id: social-login
  term: Social login
  short: "Signing in through another provider, like Sign in with Apple or Continue with Google."
  definition: >-
    The app asks an identity provider to vouch for the user instead of handling a password. Testers
    check first-time vs returning users, canceled consent, hidden emails (Apple relay addresses)
    and linking with an existing email account.
  example: >-
    A user who signed up with email and later taps "Continue with Google" using the same address
    should land in the same account, not a new empty one.
  category: web
  aka: [OAuth login, Sign in with Apple, Sign in with Google]
  related: [authentication]

- id: biometric-authentication
  term: Biometric authentication
  short: "Unlocking a saved login with Face ID, Touch ID or a fingerprint."
  definition: >-
    Biometrics don't replace the password on the server; they unlock credentials stored securely on
    the device. Testers check enrollment, failed scans, fallback to passcode, and what happens when
    the user adds a new fingerprint.
  example: >-
    After three failed Face ID scans, the banking app should offer the app PIN instead of locking the
    user out.
  category: mobile
  aka: [Biometrics, Face ID, Touch ID, Fingerprint login]
  related: [authentication, password-manager]

- id: password-manager
  term: Password manager
  short: "A tool that stores credentials and fills them into login forms, like Apple Passwords, Google Password Manager or 1Password."
  definition: >-
    Many users never type passwords; their password manager fills them in. Forms must be marked up
    so autofill works, and paste must not be blocked. Testers try autofill on both mobile and web.
  example: >-
    On the sign-in screen, iOS should offer the saved password above the keyboard. If the fields
    aren't recognized, users with long generated passwords get stuck.
  category: tools
  aka: [iCloud Keychain, Passwords app]
  related: [autofill, biometric-authentication, text-field]

- id: three-d-secure
  term: 3-D Secure
  short: "An extra step where the card's bank asks the shopper to confirm an online payment."
  definition: >-
    With 3-D Secure the customer is sent to their bank, often their banking app, to approve a payment
    before it completes. In Europe it is the usual way to meet Strong Customer Authentication (SCA)
    rules. Testers check success, failure and cancellation, and what happens when the
    app goes to the background during the redirect.
  example: >-
    The user approves the payment in their banking app and switches back, and the shop should show
    "Order confirmed", not an empty checkout.
  category: web
  aka: [3DS]
  related: [payment-gateway, test-card]

- id: test-card
  term: Test card
  short: "A card number published by a payment provider to simulate payments in test mode."
  definition: >-
    Payment providers publish special card numbers that simulate outcomes like approved, declined
    or insufficient funds, without moving real money. Testers always use these on test environments,
    never real cards.
  example: >-
    Stripe's 4242 4242 4242 4242 approves any test payment; other published numbers trigger a
    decline or a 3-D Secure challenge.
  category: tools
  aka: [Test card number]
  related: [payment-gateway, three-d-secure, staging]

- id: coupon
  term: Coupon
  short: "A code that gives a discount or free shipping, usually with rules like expiry and minimum order."
  definition: >-
    Coupon logic is full of rules: minimum order value, expiry dates, one use per customer, which
    products qualify and whether codes can be combined. That makes it a favorite place for
    testers to look for money-losing bugs.
  example: >-
    Applying SAVE10 twice should not give 20% off, and an expired code should show a clear message.
  category: web
  aka: [Promo code, Discount code, Voucher]
  related: [boundary-value-analysis, idempotency]

- id: har-file
  term: HAR file
  short: "A file that records every network request and response a web page made."
  definition: >-
    Browsers can export a HAR (HTTP Archive) file from the DevTools Network tab. Attaching one to a
    bug report lets developers see exactly which requests failed. It can contain cookies and tokens,
    so share it carefully.
  example: >-
    The checkout fails only for you. You export a HAR file, and the developer sees a 500 from the
    tax service.
  category: tools
  related: [devtools, bug-report]

- id: logcat
  term: Logcat
  short: "Android's system log, read with adb logcat, where apps write errors and crash details."
  definition: >-
    When an Android app crashes, logcat usually contains the reason (the stack trace). Testers capture
    the relevant part and attach it to bug reports. On iOS, the Xcode console or the Console app serve
    the same purpose.
  example: >-
    Reproduce the crash with the device connected, run adb logcat, and copy the lines starting with
    "FATAL EXCEPTION".
  category: tools
  aka: [adb logcat, Device log]
  related: [crash, bug-report]

- id: workaround
  term: Workaround
  short: "Another way for users to reach their goal while a bug is still unfixed."
  definition: >-
    If users can avoid a bug easily, it often gets a lower priority. Testers note known workarounds in
    bug reports because they affect how urgent the fix is.
  example: >-
    The "Save" button doesn't work on the profile screen, but changes save when you press Enter. That's
    a workaround, though the bug still needs fixing.
  category: bugs
  related: [priority, severity]

- id: duplicate-bug
  term: Duplicate bug
  short: "A bug report that describes a bug someone already reported."
  definition: >-
    Before filing, testers search the tracker for existing reports. Duplicates get linked to the
    original and closed. If you have new information, add it as a comment on the original.
  example: >-
    You find a crash on the cart screen, search Jira for "cart crash", and add your device details to
    the existing ticket instead of creating a new one.
  category: bugs
  aka: [Duplicate]
  related: [bug-life-cycle, bug-report, jira]

- id: app-lifecycle
  term: App lifecycle
  short: "The states an app moves through: not running, foreground, background, suspended and terminated."
  definition: >-
    Mobile operating systems pause, suspend and kill apps to save battery and memory. Each change
    of state is a chance for bugs: lost form data, frozen timers, duplicate requests. Testers
    move apps between states on purpose and check that nothing breaks.
  example: >-
    You start filling in a long delivery form, switch to WhatsApp for two minutes, and come back.
    The form should still be filled in.
  category: mobile
  aka: [Application lifecycle]
  related: [interruption, state-persistence]

- id: interruption
  term: Interruption
  short: "Anything that takes the user away from the app mid-task: a call, an alarm, a notification, low battery."
  definition: >-
    Interruption testing checks how an app behaves when something else grabs the screen or the
    system's attention. The app should pause sensibly and resume without losing data or crashing.
  example: >-
    A phone call arrives during a video upload. After the call, the upload should continue or
    clearly offer to retry.
  category: mobile
  aka: [Interruption testing]
  related: [app-lifecycle, push-notification]

- id: orientation
  term: Orientation
  short: "Whether the device is held upright (portrait) or sideways (landscape)."
  definition: >-
    Rotating the device changes the screen size and, on Android, may recreate the screen
    entirely. Testers rotate during typing, loading and playback to find layout breaks and lost
    state.
  example: >-
    Rotating the phone while a checkout form is half filled should keep every value you typed.
  category: mobile
  aka: [Portrait, Landscape, Rotation]
  related: [state-persistence, responsive-design]

- id: safe-area
  term: Safe area
  short: "The part of the screen not covered by the notch, Dynamic Island, rounded corners or home indicator."
  definition: >-
    Modern phones have screen areas where content can be hidden or hard to tap. Layouts should keep
    important content and buttons inside the safe area. Testers check edge-to-edge screens on
    devices with different cut-outs.
  example: >-
    On an iPhone with a Dynamic Island, the app's back button is partly hidden behind it in
    landscape mode.
  category: mobile
  aka: [Notch, Safe area insets]
  related: [orientation, fragmentation]

- id: network-throttling
  term: Network throttling
  short: "Deliberately slowing the connection to test how an app behaves on poor networks."
  definition: >-
    Testers simulate 3G, high latency, packet loss or offline mode with DevTools, proxy tools or
    device developer settings. Slow networks expose missing loading states, timeouts, race
    conditions and double submits.
  example: >-
    With "Slow 3G" enabled, the login button can be tapped three times before the first request
    finishes.
  category: tools
  aka: [Throttling, Network conditioning]
  related: [loading-state, race-condition, proxy-tool]

- id: proxy-tool
  term: Proxy tool
  short: "A program that sits between the app and the server so you can watch and change network traffic."
  definition: >-
    Tools like Charles Proxy, Proxyman and Fiddler show every request and response, and can
    modify them, slow them down or block them. Testers use them to check what an app sends and to
    simulate server errors.
  example: >-
    Using Proxyman's map local feature, you replace the real product list response with an empty
    one to test the empty state.
  category: tools
  aka: [Charles, Proxyman, Fiddler, HTTP proxy]
  related: [api, network-throttling, ssl-certificate]

- id: ssl-certificate
  term: SSL certificate
  short: "The certificate that lets a browser or app verify a server's identity and encrypt traffic (HTTPS)."
  definition: >-
    Certificates make HTTPS work. To inspect encrypted traffic, proxy tools install their own
    certificate on the test device. Some apps use certificate pinning and refuse that, which is
    why test builds often disable it.
  example: >-
    After installing the Charles certificate on a test iPhone, you can read the JSON the app
    sends during checkout.
  category: web
  aka: [TLS certificate, HTTPS certificate]
  related: [proxy-tool, https, certificate-pinning]

- id: https
  term: HTTPS
  short: "The secure version of HTTP; traffic between the browser or app and the server is encrypted."
  definition: >-
    HTTPS protects passwords, cards and personal data from being read or changed in transit.
    Testers check that every page and API call uses HTTPS and that browsers show no
    "not secure" or mixed-content warnings.
  example: >-
    The login page loads over HTTPS, but the profile picture comes from an http:// address and the
    browser shows a mixed-content warning.
  category: web
  related: [ssl-certificate, security-testing]

- id: adb
  term: adb
  short: "Android Debug Bridge: a command-line tool for installing apps, reading logs and controlling Android devices."
  definition: >-
    adb talks to a connected Android device or emulator. Testers use it to install builds, take
    screenshots and recordings, read logcat, clear app data and simulate events, all from the
    computer.
  example: >-
    adb install app-debug.apk installs a test build, and adb shell pm clear com.shop.app resets
    the app to a fresh install state.
  category: tools
  aka: [Android Debug Bridge]
  related: [logcat, emulator]

- id: testflight
  term: TestFlight
  short: "Apple's service for distributing beta builds of iOS apps to testers before App Store release."
  definition: >-
    Developers upload a build, and invited testers install it through the TestFlight app. Builds
    expire after 90 days. Testers check the version and build number in TestFlight before testing
    and report which build they used.
  example: >-
    The bug is fixed in build 2.4.0 (318). You update through TestFlight and retest on that exact
    build.
  category: tools
  related: [build, firebase-app-distribution, release]

- id: firebase-app-distribution
  term: Firebase App Distribution
  short: "Google's service for sending pre-release Android (and iOS) builds to testers."
  definition: >-
    Teams upload builds to Firebase App Distribution and testers get an email or an app to install
    them. It's common for Android test builds that aren't yet on Google Play, often alongside
    Google Play's internal testing tracks.
  example: >-
    Each night the CI server uploads a new Android build, and testers install it from the App
    Tester app the next morning.
  category: tools
  aka: [App Distribution, App Tester]
  related: [testflight, build]

- id: upgrade-testing
  term: Upgrade testing
  short: "Checking that updating from an older app version keeps the user's data and settings working."
  definition: >-
    Real users don't install fresh; they update. Upgrade testing installs an old version, creates
    data, then updates to the new build and checks logins, saved items, settings and database
    migrations.
  example: >-
    After updating from 3.1 to 3.2, users are logged out and their saved addresses are gone. A fresh
    install would never show this bug.
  category: mobile
  aka: [Update testing, Migration testing]
  related: [regression-testing, state-persistence]

- id: os-version
  term: OS version
  short: "Which version of iOS, Android or another operating system a device runs."
  definition: >-
    Apps support a range of OS versions, and behavior differs between them: permissions,
    notifications, back gestures and system dialogs all change. Bug reports must include the OS
    version, and test plans cover the oldest and newest supported ones.
  example: >-
    The photo picker works on Android 14 but crashes on Android 10, the oldest version the app
    supports.
  category: mobile
  aka: [Operating system version, iOS version, Android version]
  related: [fragmentation, compatibility-testing]

- id: app-permissions
  term: App permissions
  short: "The user's approval for an app to use things like the camera, location, contacts or notifications."
  definition: >-
    Mobile apps must ask before using sensitive features, and users can deny or revoke permission
    at any time. Testers check allow, deny, "only this time", revoking in settings, and the app's
    explanation of why it needs access.
  example: >-
    If the user denies camera access, the "Scan card" button should explain how to enable it in
    Settings instead of showing a black screen.
  category: mobile
  aka: [Permissions, Runtime permissions]
  related: [authorization, os-version]

- id: breakpoint
  term: Breakpoint
  short: "A screen width where a responsive layout changes, for example from one column to two."
  definition: >-
    Responsive sites use breakpoints (such as 640, 768, 1024 px) to rearrange content. Bugs cluster
    just around them, so testers check widths slightly below and above each breakpoint, not just
    common device sizes. (Not to be confused with a proxy breakpoint, which pauses a network request.)
  example: >-
    At exactly 768 px the navigation menu disappears and the hamburger icon hasn't appeared yet,
    so there is no menu at all.
  category: web
  aka: [Responsive breakpoint, Media query]
  related: [responsive-design, viewport, window-size-class, boundary-value-analysis]

- id: user-agent
  term: User agent
  short: "The text a browser sends to identify itself, its version and operating system."
  definition: >-
    Websites sometimes change behavior based on the user agent. DevTools can fake it to imitate
    other devices, but that doesn't change the real rendering engine, so it can't replace testing
    on real browsers.
  example: >-
    The site shows "Your browser is not supported" to the latest Firefox because it only checks
    for the word "Chrome" in the user agent.
  category: web
  aka: [UA string]
  related: [cross-browser-testing, devtools]

- id: local-storage
  term: Local storage
  short: "Browser storage where websites keep data that survives closing the tab, like settings or a cart."
  definition: >-
    Local storage (localStorage) keeps key-value data in the browser for one origin until the site or
    the user clears it, and is shared by all tabs of that site. Its sibling, session storage
    (sessionStorage), works the same way but belongs to a single tab and is cleared when the tab
    closes. Unlike cookies, neither is sent to the server automatically. Testers inspect and edit both
    in DevTools, and check that nothing sensitive is stored there.
  example: >-
    The shopping cart lives in localStorage, so it's still there after closing the browser, which is
    expected. A plain-text password stored there is a security bug.
  category: web
  aka: [localStorage, Session storage, Web storage]
  related: [cookie, indexeddb, cache, devtools]

- id: http-status-code
  term: HTTP status code
  short: "A three-digit number in every server response: 200 means OK, 404 not found, 500 server error."
  definition: >-
    Status codes are grouped: 2xx success, 3xx redirect, 4xx client errors (bad request, unauthorized,
    not found), 5xx server errors. Testers read them in DevTools or proxy tools to understand
    failures and to check that the app shows the right message for each.
  example: >-
    The app says "Wrong password" but the network tab shows a 500, so the real problem is a server
    error, not the password.
  category: web
  aka: [Status code, Response code]
  related: [api, http-method, devtools]

- id: http-method
  term: HTTP method
  short: "The type of request: GET reads data, POST creates, PUT/PATCH updates, DELETE removes."
  definition: >-
    Each API request uses a method that says what it intends to do. Testers check that the right
    method is used (for example, never sending passwords with GET) and test what happens when
    requests are repeated.
  example: >-
    Sending the same POST /orders twice creates two orders, while sending the same GET /orders
    twice changes nothing.
  category: web
  aka: [HTTP verb, GET, POST]
  related: [api, http-status-code, idempotency]

- id: endpoint
  term: Endpoint
  short: "A specific API address the app calls, like GET /api/products or POST /api/login."
  definition: >-
    An endpoint combines a URL path and a method. API documentation lists endpoints with their
    inputs and outputs. Testers call endpoints directly, for example in Postman, to test logic
    without the UI.
  example: >-
    POST /api/coupons/apply with code SAVE10 should return the discounted total, and an expired code
    should return a 400 with a clear error.
  category: web
  aka: [API endpoint, Route]
  related: [api, http-method, json]

- id: json
  term: JSON
  short: "A simple text format for data, used by most APIs, like {\"name\": \"Anna\", \"age\": 31}."
  definition: >-
    JSON (JavaScript Object Notation) represents data as keys and values, lists and nested objects.
    Testers read JSON responses to check that data is correct and complete, and edit request bodies
    to test validation.
  example: >-
    The product page shows no price. The JSON response has "price": null, so the problem is in the
    data, not the app's layout.
  category: web
  related: [api, endpoint]

- id: postman
  term: Postman
  short: "A popular tool for sending API requests and checking responses without using the app's UI."
  definition: >-
    In Postman you build requests (method, URL, headers, body), send them and inspect the response.
    Requests can be saved in collections, use environments for staging and production, and include
    automated checks.
  example: >-
    You send POST /api/login with a wrong password 6 times in Postman to check that the account
    lockout works even without the app.
  category: tools
  aka: [API client]
  related: [api, endpoint, json]

- id: lighthouse
  term: Lighthouse
  short: "A free tool in Chrome DevTools that audits a page's performance, accessibility, SEO and best practices."
  definition: >-
    Lighthouse loads a page, measures it and gives scores from 0 to 100 with a list of concrete
    problems. Scores vary between runs and machines, so testers compare runs under the same
    conditions and focus on the specific findings.
  example: >-
    Lighthouse reports that images on the home page are 4 MB each and that buttons have no
    accessible name.
  category: tools
  related: [core-web-vitals, accessibility-testing, devtools]

- id: core-web-vitals
  term: Core Web Vitals
  short: "Google's key page experience metrics: loading (LCP), responsiveness (INP) and visual stability (CLS)."
  definition: >-
    LCP measures how fast the main content appears, INP how quickly the page responds to input, and
    CLS how much the layout jumps around while loading. They give testers concrete numbers to
    report instead of "the page feels slow".
  example: >-
    You tap "Add to cart" just as a banner loads and pushes the page down, so you hit "Remove"
    instead. That layout shift is what CLS measures.
  category: web
  aka: [LCP, INP, CLS, Web Vitals]
  related: [lighthouse, performance-testing]

- id: contrast-ratio
  term: Contrast ratio
  short: "How different text and background colors are; WCAG asks for at least 4.5:1 for normal text."
  definition: >-
    Low contrast makes text hard to read, especially in sunlight or for people with low vision.
    WCAG AA requires 4.5:1 for normal text, 3:1 for large text and for UI parts like icons and
    input borders. Testers measure it with DevTools or contrast checkers.
  example: >-
    Light grey placeholder text (#BBBBBB) on white has a ratio of about 1.9:1, far below the 4.5:1
    minimum.
  category: web
  aka: [Color contrast]
  related: [wcag, accessibility-testing]

- id: alt-text
  term: Alt text
  short: "A text description of an image that screen readers read aloud."
  definition: >-
    Meaningful images need alt text describing their content or purpose; decorative images should
    have empty alt text so screen readers skip them. Testers check with a screen reader or by
    inspecting the HTML.
  example: >-
    A product photo announced as "IMG_4821.jpg" instead of "Red running shoes, side view" is an
    accessibility bug.
  category: web
  aka: [Alternative text, Accessibility label]
  related: [screen-reader, wcag, aria]

- id: aria
  term: ARIA
  short: "HTML attributes that tell assistive technology what custom elements are and what state they're in."
  definition: >-
    ARIA (Accessible Rich Internet Applications) adds roles like dialog or tab, states like
    aria-expanded and labels like aria-label. It helps when native HTML isn't enough, but wrong ARIA
    is worse than none.
  example: >-
    A custom dropdown without aria-expanded leaves screen reader users unaware whether the list is
    open or closed.
  category: web
  aka: [WAI-ARIA, aria-label]
  related: [screen-reader, wcag, alt-text]

- id: keyboard-navigation
  term: Keyboard navigation
  short: "Using a website with only the keyboard: Tab to move, Enter or Space to activate, Esc to close."
  definition: >-
    Many people navigate without a mouse. Every interactive element must be reachable with Tab, in a
    logical order, with a visible focus indicator, and must work with Enter, Space or arrow keys as
    appropriate.
  example: >-
    You can Tab to the "Accept cookies" banner but not to its buttons, so keyboard users can never
    close it.
  category: web
  aka: [Keyboard accessibility]
  related: [focus-trap, focus-order, wcag, aria]


- id: semantic-versioning
  term: "Semantic versioning"
  short: "A MAJOR.MINOR.PATCH version format where each number signals how big a change is."
  definition: "In 2.4.1, a major change bumps 2, new features bump 4 and bug fixes bump 1. The build number (e.g. 318) is separate and identifies the exact build."
  example: "Release notes for 3.0.0 hint at big changes, so you plan a much wider regression test than for 2.4.2."
  category: process
  aka: ["SemVer"]
  related: [release, build, release-notes]

- id: data-migration
  term: "Data migration"
  short: "Code that converts data saved by an older app version into the format a newer version expects."
  definition: "When an app changes how it stores data, every older format must be converted on update. Migrations that only handle the previous version break for users who skip versions."
  example: "Users who update from 1.0 straight to 2.0 lose their favorites because only the 1.9 → 2.0 migration exists."
  category: mobile
  aka: ["Migration"]
  related: [upgrade-testing, state-persistence]

- id: keychain
  term: "Keychain"
  short: "iOS secure storage for small secrets like tokens and passwords; items can survive uninstalling the app."
  definition: "Apps keep login tokens in the Keychain (Android has the Keystore). Because Keychain items can outlive the app, a reinstalled app may still find an old token."
  example: "After deleting and reinstalling the app, it greets you with the previous user's name because the old token was still in the Keychain."
  category: mobile
  aka: ["Secure storage"]
  related: [password-manager, upgrade-testing]

- id: forced-update
  term: "Forced update"
  short: "A blocking 'Update required' screen shown when the installed version is older than a minimum set on the server."
  definition: "Teams force updates when old versions can no longer work with the server. Testers check the version comparison, the store link, and that the prompt disappears after updating."
  example: "Version 1.10 keeps showing 'Update required' because the app compares '1.10' < '1.9' as text."
  category: mobile
  aka: ["Minimum version", "Update prompt"]
  related: [semantic-versioning, upgrade-testing]

- id: release-notes
  term: "Release notes"
  short: "A short list of what changed, what was fixed and the known issues in a build."
  definition: "Release notes tell testers what to retest and where to look for regressions. Reading them first is the start of every new-build routine."
  example: "Build 318's notes list the fix for BUG-412, so you retest it first, then run a smoke test."
  category: process
  aka: ["Changelog", "What's new"]
  related: [build, retesting, testflight]

- id: beta-testing
  term: "Beta testing"
  short: "Testing a pre-release build with a group of testers or real users before store release."
  definition: "Beta builds go out through TestFlight, Google Play testing tracks or Firebase App Distribution. Feedback from beta users catches problems on devices and in situations the team didn't cover."
  example: "200 external beta testers use the new checkout for a week before it ships to everyone."
  category: process
  aka: ["Beta", "Pre-release testing"]
  related: [testflight, firebase-app-distribution, uat]

- id: idor
  term: "IDOR"
  short: "Insecure Direct Object Reference: reaching another user's data by changing an ID in a URL or request."
  definition: "If the server doesn't check that the logged-in user owns the requested object, changing /orders/1042 to /orders/1043 shows someone else's order. Test only with your own test accounts."
  example: "Logged in as test user Anna, you open /invoices/88 and see test user Ben's invoice."
  category: web
  aka: ["Insecure direct object reference"]
  related: [broken-access-control, authorization]

- id: owasp-top-10
  term: "OWASP Top 10"
  short: "A regularly updated list of the most critical security risks for web applications."
  definition: "Published by the OWASP foundation, it's a common map for what to look for: broken access control, injection, security misconfiguration and more. Testers use it as a checklist of areas, not a step-by-step guide."
  example: "Your team's security checklist is organized by OWASP Top 10 categories."
  category: web
  aka: ["OWASP"]
  related: [security-testing, broken-access-control]

- id: broken-access-control
  term: "Broken access control"
  short: "Users can see or do things their role should not allow."
  definition: "It's the most common serious web risk: hidden buttons without server checks, admin pages open to normal users, or other users' data reachable by changing IDs."
  example: "A normal customer opens /admin by typing the URL, because the link was only hidden from the menu."
  category: web
  related: [idor, authorization, owasp-top-10]

- id: mixed-content
  term: "Mixed content"
  short: "An HTTPS page loading images, scripts or other resources over plain HTTP."
  definition: "Browsers block or warn about mixed content because it weakens the page's security. Testers spot it in the DevTools console and the address bar's padlock."
  example: "The checkout page is HTTPS, but the payment logo loads from http://, and the console shows a mixed-content warning."
  category: web
  related: [https, devtools]

- id: openapi
  term: "OpenAPI"
  short: "A standard file format that describes an API's endpoints, parameters and responses (formerly called Swagger)."
  definition: "OpenAPI files power interactive API docs where you can read and try every endpoint. Testers compare real responses with what the spec promises."
  example: "The spec says price is a number, but the API returns \"19.99\" as a string, which is a bug."
  category: tools
  aka: ["Swagger", "API spec"]
  related: [api, endpoint, postman]

- id: latency
  term: "Latency"
  short: "The delay before data starts arriving, measured as a round trip in milliseconds."
  definition: "High latency makes every request slow to start, even on a fast connection. It's why apps feel sluggish on satellite or congested mobile networks."
  example: "A 600 ms round trip means an app that makes 5 requests in a row waits 3 seconds before showing anything."
  category: web
  aka: ["Ping", "Round-trip time"]
  related: [bandwidth, network-throttling]

- id: bandwidth
  term: "Bandwidth"
  short: "How much data a connection can move per second."
  definition: "Low bandwidth makes large downloads slow, like images, videos and big app bundles. It's different from latency, which is about delay rather than capacity."
  example: "A 4 MB hero image takes over 10 seconds on a slow 3G connection."
  category: web
  aka: ["Throughput"]
  related: [latency, network-throttling]

- id: packet-loss
  term: "Packet loss"
  short: "The share of data that never arrives and has to be sent again."
  definition: "On unstable networks some data is lost, causing retries, stalls and timeouts. Testers simulate it with network conditioners to find apps that hang."
  example: "With 10% packet loss, the video call freezes, but the chat should still deliver messages, perhaps late."
  category: web
  related: [latency, network-throttling]

- id: timeout
  term: "Timeout"
  short: "The time limit after which an app stops waiting for a response and gives up."
  definition: "Without a timeout, an app may spin forever on a dead connection. Testers check that a timeout exists, is reasonable, and leads to a clear message with a retry."
  example: "After 30 seconds without a response, the app should show 'Can't connect. Try again.' instead of an endless spinner."
  category: web
  related: [loading-state, retry-backoff]

- id: retry-backoff
  term: "Retry with backoff"
  short: "Automatically trying a failed request again, waiting longer between each attempt."
  definition: "Good apps retry temporary failures, but slowly enough not to overload the server. Retries must never repeat actions that aren't safe to repeat, like payments without idempotency."
  example: "The app retries loading the feed after 1, 2 and 4 seconds, then shows a Retry button."
  category: web
  aka: ["Exponential backoff", "Retry"]
  related: [timeout, idempotency]

- id: captive-portal
  term: "Captive portal"
  short: "A Wi-Fi login page that intercepts traffic until the user signs in or accepts terms."
  definition: "Hotel, airport and café Wi-Fi often show a captive portal. Apps see a 'connected' network that returns odd responses, which can confuse them."
  example: "On hotel Wi-Fi before logging in, the app shows 'Unexpected data' instead of 'No internet connection'."
  category: mobile
  related: [network-throttling, offline-mode]

- id: offline-mode
  term: "Offline mode"
  short: "How an app behaves without a connection: showing cached content, queuing actions, or explaining what's unavailable."
  definition: "Good offline behavior means clear messages, cached data marked as possibly outdated, and safe syncing when the connection returns."
  example: "Offline, the shopping list still opens and new items are queued, then synced when the phone is back online."
  category: mobile
  aka: ["Offline support"]
  related: [cache, network-throttling]

- id: certificate-pinning
  term: "Certificate pinning"
  short: "An app accepting only its own server's real certificate, which also blocks proxy tools."
  definition: "Pinning protects users from interception, but it stops testers from inspecting traffic with Charles or Proxyman. Teams usually provide debug builds without pinning."
  example: "Proxyman shows only failed connections for the production app, so you ask for a debug build."
  category: mobile
  aka: ["SSL pinning"]
  related: [ssl-certificate, proxy-tool]

- id: map-local
  term: "Map Local"
  short: "A proxy rule that answers a request with a file you choose instead of the real server response."
  definition: "Testers use it to simulate empty lists, huge lists, missing fields or error responses without changing the server."
  example: "You map GET /v1/products to a file with an empty list and check that the app shows a proper empty state."
  category: tools
  aka: ["Map Remote"]
  related: [proxy-tool, empty-state]

- id: proxy-breakpoint
  term: "Proxy breakpoint"
  short: "Pausing a request or response in a proxy tool so you can edit it before it continues."
  definition: "Breakpoints in Charles or Proxyman let testers change prices, status codes or fields on the fly to see how the app and server react. Not the same as a responsive layout breakpoint."
  example: "You pause the order request, change the total to 0.01 and see whether the server trusts it."
  category: tools
  aka: ["Breakpoint (Charles/Proxyman)"]
  related: [proxy-tool, map-local]

- id: airplane-mode
  term: "Airplane mode"
  short: "A device setting that turns off all wireless connections at once."
  definition: "It's the quickest way to test offline behavior on a real device. Note that Wi-Fi can be turned back on while airplane mode stays on."
  example: "Turning on airplane mode during a photo upload should show 'Upload paused' rather than silently losing the photo."
  category: mobile
  aka: ["Flight mode"]
  related: [offline-mode, interruption]

- id: device-matrix
  term: "Device matrix"
  short: "The list of devices and OS versions a team tests on, chosen to represent real users."
  definition: "A good matrix covers the most popular devices, the oldest and newest supported OS, a small screen, a low-end device and a tablet or foldable. It's usually based on analytics."
  example: "Your matrix has iPhone SE, iPhone 16, Pixel 8, Galaxy A15, a Xiaomi phone and an iPad."
  category: mobile
  aka: ["Test matrix", "Device coverage"]
  related: [fragmentation, device-farm]

- id: device-farm
  term: "Device farm"
  short: "A cloud service with remote access to many real or virtual devices, such as BrowserStack or Firebase Test Lab."
  definition: "Device farms let testers check devices they don't own, either manually in the browser or with automated tests."
  example: "A bug appears only on Samsung phones, so you reproduce it on a Galaxy A54 in a cloud device lab."
  category: tools
  aka: ["Device cloud", "Cloud device lab"]
  related: [device-matrix, real-device]

- id: anr
  term: "ANR"
  short: "Application Not Responding: Android's dialog when an app freezes for about 5 seconds."
  definition: "An ANR happens when the app's main thread is blocked. Testers report it like a crash, with steps and the 'ANR in' section from logcat."
  example: "Tapping Export on a large order history freezes the app, and Android asks 'App isn't responding. Close app?'"
  category: mobile
  aka: ["App not responding"]
  related: [crash, logcat]

- id: stack-trace
  term: "Stack trace"
  short: "The list of function calls printed when an error happens, showing where in the code it occurred."
  definition: "Developers use the stack trace to find the failing line. Testers copy the relevant part, usually starting at the exception name, into the bug report."
  example: "logcat shows 'FATAL EXCEPTION … NullPointerException at DeepLinkParser.kt:27', the line the developer needs."
  category: bugs
  aka: ["Stacktrace", "Backtrace"]
  related: [crash, logcat]

- id: package-name
  term: "Package name"
  short: "An Android app's unique ID, like com.shopeasy.app (the iOS equivalent is the bundle ID)."
  definition: "adb commands and store listings use it to identify an app. Debug and release builds often have different package names so they can be installed side by side."
  example: "adb shell pm clear com.shopeasy.app.debug resets only the debug build."
  category: mobile
  aka: ["Application ID", "Bundle ID"]
  related: [adb]

- id: lazy-loading
  term: "Lazy loading"
  short: "Loading images or content only when the user scrolls near them."
  definition: "It speeds up the first view of a page. Testers check that lazy content does load when scrolled to, doesn't cause layout jumps, and that the main image is not lazy-loaded."
  example: "Product photos further down the page load as you scroll, but the hero image appears immediately."
  category: web
  related: [core-web-vitals, performance-testing]

- id: render-blocking-resource
  term: "Render-blocking resource"
  short: "A CSS or JavaScript file the browser must download before it can show the page."
  definition: "Large render-blocking files delay the first paint, so users stare at a white screen. They show up early in the DevTools waterfall."
  example: "A 1.1 MB script without defer keeps the page blank for 3 seconds on mobile."
  category: web
  related: [core-web-vitals, lighthouse]

- id: time-to-first-byte
  term: "Time to first byte (TTFB)"
  short: "How long the server takes to start sending a response after the request."
  definition: "A slow TTFB points to the server or backend, not the page size. In DevTools it appears as the 'Waiting for server response' part of a request."
  example: "The recommendations API waits 3 seconds before sending anything; that's a backend issue to report."
  category: web
  aka: ["TTFB"]
  related: [core-web-vitals, api]

- id: field-data
  term: "Field data vs lab data"
  short: "Field data is measured from real users; lab data comes from a controlled test like Lighthouse."
  definition: "Lab data is repeatable and great for debugging; field data shows what real users experience. They often disagree, and both are useful in a bug report."
  example: "Lighthouse looks fine on your laptop, but field data shows LCP of 4 s for most mobile users."
  category: web
  aka: ["Lab data", "Real user monitoring", "CrUX"]
  related: [lighthouse, core-web-vitals]

- id: focus-order
  term: "Focus order"
  short: "The order in which the Tab key moves through interactive elements."
  definition: "Focus should follow the visual reading order. Jumps, skipped controls or focus landing on hidden elements confuse keyboard and screen reader users."
  example: "Pressing Tab after the email field jumps to the footer, skipping the password field."
  category: web
  aka: ["Tab order"]
  related: [keyboard-navigation, wcag]

- id: reflow
  term: "Reflow"
  short: "Content rearranging into a single column at narrow widths or high zoom, without sideways scrolling."
  definition: "WCAG 1.4.10 asks that content works at 320 CSS pixels wide (like 400% zoom) without scrolling in two directions."
  example: "At 400% zoom the article becomes one column, but the data table still forces sideways scrolling, which is acceptable only for content like tables."
  category: web
  related: [responsive-design, wcag]

- id: captions
  term: "Captions"
  short: "On-screen text for the speech and important sounds in a video."
  definition: "Captions help deaf and hard-of-hearing users, and anyone watching without sound. Testers check timing, accuracy and that sounds like [doorbell rings] are included."
  example: "The tutorial video has auto-generated captions that spell the product name wrong throughout."
  category: web
  aka: ["Subtitles"]
  related: [accessibility-testing, wcag]

- id: rendering-engine
  term: "Rendering engine"
  short: "The part of a browser that turns HTML and CSS into what you see: Blink, WebKit or Gecko."
  definition: "Chrome, Edge and Samsung Internet use Blink; Safari uses WebKit; Firefox uses Gecko. On iOS, browsers use WebKit because of Apple's rules (only in the EU may they use their own engine, and few do), so testing 'Chrome on iPhone' mostly tests Safari's engine."
  example: "A layout bug appears in Safari and in Chrome on iPhone, but not in Chrome on Android, so it's a WebKit issue."
  category: web
  aka: ["Browser engine"]
  related: [cross-browser-testing, browser-matrix]

- id: feature-detection
  term: "Feature detection"
  short: "Checking whether the browser supports a feature before using it, instead of guessing from its name."
  definition: "Sites should test for a feature and offer a fallback. Guessing from the user agent breaks for new or less common browsers."
  example: "Express pay is hidden in browsers without the Payment Request API instead of throwing an error."
  category: web
  related: [user-agent, cross-browser-testing]

- id: browser-matrix
  term: "Browser matrix"
  short: "The agreed list of browsers, versions and devices a site supports, and how deeply each is tested."
  definition: "Teams choose it from analytics, often in tiers: fully tested, smoke tested, and best effort. Bugs in unsupported browsers may still be worth reporting if many users are affected."
  example: "Tier 1: Chrome, Safari iOS and Edge, latest two versions. Tier 2: Firefox and Samsung Internet."
  category: web
  aka: ["Browser support matrix"]
  related: [cross-browser-testing, device-matrix]

- id: third-party-cookie
  term: "Third-party cookie"
  short: "A cookie set by a different domain than the site in the address bar, usually for ads or tracking."
  definition: "Browsers increasingly block or limit them. Features that rely on third-party cookies, like some embedded logins or widgets, can break in Safari and Firefox."
  example: "The embedded chat widget logs you out on every page in Safari, because its third-party cookie is blocked."
  category: web
  related: [cookie, consent-banner]

- id: consent-banner
  term: "Consent banner"
  short: "The banner that asks permission before setting non-essential cookies."
  definition: "Under EU and UK rules, rejecting must be as easy as accepting, and the choice must actually be respected. Testers check the cookies set after each choice in DevTools."
  example: "After clicking 'Reject all', analytics cookies still appear in the Application panel, which is a bug."
  category: web
  aka: ["Cookie banner", "GDPR banner"]
  related: [cookie, third-party-cookie]

- id: indexeddb
  term: "IndexedDB"
  short: "A database inside the browser for larger structured data, often used for offline features."
  definition: "Web apps store messages, drafts or cached data in IndexedDB. Testers inspect it in the DevTools Application panel and check it's cleared on logout when it should be."
  example: "An email web app keeps the last 500 messages in IndexedDB so the inbox opens offline."
  category: web
  related: [local-storage, offline-mode]

- id: httponly-cookie
  term: "HttpOnly cookie"
  short: "A cookie flag that hides the cookie from page JavaScript, protecting session IDs if the page is attacked."
  definition: "Session cookies should be HttpOnly, Secure (HTTPS only) and have a SameSite setting. Testers check these flags in the DevTools cookie table."
  example: "The session_id cookie has no tick in the HttpOnly column, so any injected script could read it."
  category: web
  aka: ["HttpOnly", "Secure flag"]
  related: [cookie, session, samesite]

- id: samesite
  term: "SameSite"
  short: "A cookie setting (Strict, Lax or None) that controls whether a cookie is sent on requests from other sites."
  definition: "It helps protect against cross-site attacks. Lax is a common default; None requires the Secure flag. Wrong settings can also break legitimate logins from other sites."
  example: "After a bank redirects back from 3-D Secure, the shop logs you out because its session cookie is SameSite=Strict."
  category: web
  aka: ["SameSite attribute"]
  related: [cookie, httponly-cookie]

- id: console-error
  term: "Console error"
  short: "A red message in the browser console showing a JavaScript exception or a failed resource."
  definition: "Errors often explain why a button 'does nothing'. Testers copy the full message into bug reports, along with the steps that caused it."
  example: "Clicking 'On sale' does nothing, and the console shows 'TypeError: Cannot read properties of undefined (reading map)'."
  category: web
  aka: ["JavaScript error"]
  related: [devtools, bug-report]

- id: touch-slop
  term: "Touch slop"
  short: "The small distance a finger may move before a touch counts as movement instead of a tap."
  definition: "If the threshold is too small, taps become accidental swipes; too large, and swipes feel sluggish. Gesture bugs often come down to these thresholds."
  example: "A tiny wobble while tapping an email opens the swipe-to-delete action instead."
  category: mobile
  aka: ["Touch threshold"]
  related: [gesture]

- id: configuration-change
  term: "Configuration change"
  short: "An Android event like rotation, folding, dark mode, font size or language that recreates the screen by default."
  definition: "If an app doesn't save its state, every configuration change can wipe form fields or scroll position. Testers trigger them deliberately mid-task."
  example: "Switching the system to dark mode while typing a review clears the text you typed."
  category: mobile
  related: [orientation, state-persistence]

- id: haptic-feedback
  term: "Haptic feedback"
  short: "A short vibration that confirms an action without the user needing to look at the screen."
  definition: "Haptics accompany long presses, toggles and successful payments. Testers check they fire once, at the right moment, and respect system settings."
  example: "A long press on a message gives one short tap of vibration as the menu opens."
  category: mobile
  aka: ["Haptics", "Vibration feedback"]
  related: [gesture]

- id: window-size-class
  term: "Window size class"
  short: "Android's width buckets (compact, medium, expanded) used to choose a layout."
  definition: "Compact is under 600 dp, medium 600–839 dp and expanded 840 dp and up; newer guidance adds large (1200 dp+) and extra-large (1600 dp+). Foldables and split screen move apps between classes while they run. iOS has a similar idea called size classes (compact or regular width and height)."
  example: "Unfolding the phone moves the app from compact to expanded, and it should switch to a two-pane layout."
  category: mobile
  aka: []
  related: [orientation, responsive-design, breakpoint]

- id: auto-backup
  term: "Auto Backup"
  short: "An Android feature that backs up app data to the user's Google account and can restore it on reinstall."
  definition: "It can make a 'fresh' reinstall restore old settings or even login state. Testers check what should and shouldn't come back."
  example: "After reinstalling, the app skips onboarding because Auto Backup restored its old settings file."
  category: mobile
  aka: ["Android backup"]
  related: [keychain, upgrade-testing]

- id: state-restoration
  term: "State restoration"
  short: "Bringing the user back to the same screen and data after the OS closed the app in the background."
  definition: "When the OS kills a backgrounded app to free memory, users expect to return exactly where they were. Apps must save and restore screens, form input and scroll positions; testers simulate the kill on purpose."
  example: "After an hour in the background, reopening the banking app should still show the half-filled transfer form, not the home screen."
  category: mobile
  related: [app-lifecycle, state-persistence]

- id: audio-focus
  term: "Audio focus"
  short: "Which app currently owns the sound output, and how other apps pause or lower their audio."
  definition: "Phones decide which app may play sound. A call, alarm or navigation prompt takes audio focus, and other apps should pause or duck their volume, then resume sensibly."
  example: "A podcast should pause when a call comes in, and lower its volume briefly while the maps app says 'turn left'."
  category: mobile
  aka: ["Audio session"]
  related: [interruption, app-lifecycle]

- id: cold-start
  term: "Cold start"
  short: "Launching an app whose process isn't running, the slowest kind of launch, compared with a warm or hot start."
  definition: "A cold start loads everything from scratch. In a warm start the process is still alive but the screen must be rebuilt; in a hot start the app simply comes back to the foreground. Testers check launch time, splash screens and opening the app from a notification or deep link when it's fully closed."
  example: "Tapping a delivery notification while the app is fully closed should still open the order screen after the cold start."
  category: mobile
  aka: []
  related: [app-lifecycle, deep-link]


- id: shift-left
  term: "Shift-left"
  short: "Moving testing activities earlier in development, when problems are cheapest to fix."
  definition: "Instead of testing only at the end, testers review requirements, designs and early builds. Questions asked in a planning meeting can prevent bugs that would otherwise take days to fix later."
  example: "Spotting that a story never says what happens when a coupon expires during checkout, before any code is written."
  category: process
  related: [sdlc, requirement, verification]

- id: entry-criteria
  term: "Entry and exit criteria"
  short: "Conditions that must be met before a test activity can start (entry) or before it counts as done (exit)."
  definition: "Entry criteria might be 'build deployed to staging, test data ready'. Exit criteria might be 'all high-priority tests run, no open blockers'. They stop teams from starting too early or finishing too soon."
  example: "Testing can't start because the staging environment still runs yesterday's build, so the entry criteria aren't met."
  category: process
  aka: ["Exit criteria"]
  related: [stlc, test-plan]

- id: waterfall-model
  term: "Waterfall model"
  short: "A sequential way of building software where each phase finishes before the next begins."
  definition: "Requirements, design, build, test and release happen one after another. It's predictable, but bugs in requirements are often found very late, when they're expensive to fix."
  example: "A bank's core system is planned for a year, with a 3-month testing phase at the end."
  category: process
  aka: ["Waterfall"]
  related: [sdlc, v-model, agile]

- id: v-model
  term: "V-model"
  short: "A sequential model where each development phase is paired with a matching test level."
  definition: "Requirements pair with acceptance testing, system design with system testing, architecture with integration testing and code with unit testing. Test planning starts as soon as each document exists."
  example: "While developers design the system, testers already write system test cases from the same design document."
  category: process
  aka: ["V model"]
  related: [waterfall-model, unit-testing, acceptance-testing]

- id: devops
  term: "DevOps"
  short: "A way of working where development and operations share responsibility and release small changes often through automated pipelines."
  definition: "Code goes through automated builds, tests and deployments many times a day. Manual testers focus on exploratory testing, risky changes and checking features behind feature flags."
  example: "A fix merged at 10:00 is live for 5% of users by 11:00 and for everyone by the afternoon."
  category: process
  related: [continuous-integration, release]

- id: continuous-integration
  term: "Continuous integration (CI)"
  short: "Automatically building and testing every code change as soon as it is pushed."
  definition: "CI servers run unit and integration tests on each change and report failures within minutes. Combined with continuous delivery, it gives testers a fresh build to test many times a day."
  example: "A developer's change breaks 12 unit tests and the CI pipeline turns red before the change reaches testers."
  category: tools
  aka: ["CI", "CI/CD"]
  related: [devops, build, unit-testing]

- id: test-pyramid
  term: "Test pyramid"
  short: "A model recommending many fast unit tests, fewer integration tests and few end-to-end tests."
  definition: "Lower levels are cheaper and faster, so most checks belong there. Manual and end-to-end testing sit at the top, focused on real user journeys and things automation misses. An upside-down 'ice-cream cone' means too much slow, manual testing."
  example: "A team with 2,000 unit tests, 200 API tests and 20 end-to-end tests follows the pyramid."
  category: process
  aka: ["Testing pyramid"]
  related: [unit-testing, integration-testing, system-testing]

- id: contract-testing
  term: "Contract testing"
  short: "Checking that two services keep to their agreed API contract: fields, types and status codes."
  definition: "When the app and the server are built by different teams, a contract test catches changes like a renamed field before they break the app."
  example: "The server renames 'price' to 'amount', and the contract test fails before the mobile app shows empty prices."
  category: techniques
  related: [api, integration-testing]

- id: alpha-testing
  term: "Alpha testing"
  short: "Acceptance testing by employees or other internal users before outside users see the product."
  definition: "Employees use the product in a controlled setting before outside users see it. It's followed by beta testing with external users."
  example: "Everyone at the food delivery company orders lunch through the new app version for a week before beta."
  category: types
  aka: ["Dogfooding"]
  related: [beta-testing, acceptance-testing]

- id: operational-acceptance-testing
  term: "Operational acceptance testing"
  short: "Checking a system is ready to run and be supported in production: backups, monitoring, recovery."
  definition: "It answers 'can we operate this?' rather than 'does it work for users?'. It's usually done by operations or platform teams."
  example: "The team restores last night's database backup to confirm recovery actually works before launch."
  category: types
  aka: ["OAT", "Operational testing"]
  related: [acceptance-testing, production]

- id: test-summary-report
  term: "Test summary report"
  short: "A report at the end of testing that summarizes what was tested, results, open bugs, risks and a recommendation."
  definition: "It helps the team decide whether to release. Good reports are short, honest about risks and clear about what was not tested."
  example: "'Tested 142 cases, 3 open medium bugs, payment refunds not tested on Android 10 — recommend release with a known-issue note.'"
  category: process
  aka: ["Test closure report"]
  related: [stlc, test-plan]

- id: mock
  term: "Mock"
  short: "A fake stand-in for a real dependency, used to test one part in isolation."
  definition: "Developers mock payment providers, servers or databases so tests run fast and predictably. Testers should remember that mocked parts still need testing against the real thing."
  example: "The checkout passes every test with a mocked payment provider, but fails with the real one because of a different date format."
  category: techniques
  aka: ["Stub", "Fake"]
  related: [unit-testing, integration-testing]

- id: load-testing
  term: "Load testing"
  short: "Checking the system copes with the expected number of users at the same time."
  definition: "Specialists use tools like JMeter or k6 to simulate many users. Manual testers mainly report slowness they notice and help define realistic scenarios."
  example: "The site is tested with 5,000 simultaneous shoppers before a Black Friday sale."
  category: types
  related: [stress-testing, performance-testing]

- id: stress-testing
  term: "Stress testing"
  short: "Pushing the system beyond expected load to find where it breaks and how it recovers."
  definition: "The goal is to learn the limits and make sure failures are graceful, with clear errors and full recovery afterwards."
  example: "At 3x the expected traffic the ticket shop slows down but keeps working; at 5x it shows a queue page instead of crashing."
  category: types
  related: [load-testing, performance-testing]

- id: installation-testing
  term: "Installation testing"
  short: "Checking that installing, reinstalling and uninstalling work cleanly."
  definition: "It covers fresh installs, low storage, interrupted installs and what remains after uninstalling. Upgrade testing is its close cousin."
  example: "Installing the app with almost no free storage should show a clear message, not a half-installed app."
  category: types
  aka: ["Install testing"]
  related: [upgrade-testing]

- id: internationalization
  term: "Internationalization (i18n)"
  short: "Building a product so it can be adapted to any language or region without code changes."
  definition: "Internationalization prepares the code (no hard-coded text, flexible layouts, Unicode, date and number formats). Localization then adds the actual translations and regional details."
  example: "Because texts are hard-coded, the 'Buy' button can't be translated without a new release."
  category: process
  aka: ["i18n"]
  related: [localization, locale]

- id: test-charter
  term: "Test charter"
  short: "The goal and scope of an exploratory testing session, written before it starts."
  definition: "A charter keeps exploration focused, for example 'Explore checkout with expired cards to discover payment error handling'. Sessions are usually time-boxed to 60–90 minutes."
  example: "Charter: 'Explore the search filters on a slow network to find loading and race-condition issues.' 60 minutes."
  category: techniques
  aka: ["Session charter"]
  related: [exploratory-testing]

- id: static-testing
  term: "Static testing"
  short: "Examining requirements, designs or code without running the software."
  definition: "Reviews, walkthroughs, inspections and static analysis tools find problems early and cheaply. Dynamic testing, by contrast, runs the software."
  example: "Reading a user story and noticing it contradicts the design mockup is static testing."
  category: types
  aka: []
  related: [verification, shift-left, review]

- id: review
  term: "Review"
  short: "Examining a work product, like a requirement, design or test case, to find problems before they spread."
  definition: "Reviews range from informal (a colleague reads it) to walkthroughs (the author presents it) and formal inspections (a checklist, roles and logged findings)."
  example: "During a test case review, a colleague notices no case covers the account lockout."
  category: process
  aka: ["Walkthrough", "Inspection", "Peer review"]
  related: [static-testing, verification]

- id: release-candidate
  term: "Release candidate"
  short: "A build believed ready to ship, pending final testing."
  definition: "If testing finds no blocking problems, the release candidate becomes the release. If it does, the team fixes them and builds a new candidate (RC2, RC3…)."
  example: "RC1 has a crash on login, so the team ships RC2 a day later after retesting."
  category: process
  aka: ["RC"]
  related: [build, release, regression-testing]

- id: triage
  term: "Triage"
  short: "Reviewing new bugs to decide if they're valid, how severe and urgent they are, and who fixes them."
  definition: "Teams triage in regular meetings or asynchronously. Testers bring evidence, product owners weigh business priority, and developers estimate effort."
  example: "In Monday's triage, the checkout crash becomes P1 for this sprint and the icon misalignment goes to the backlog."
  category: process
  aka: ["Bug triage"]
  related: [severity, priority, bug-life-cycle]

- id: resolution
  term: "Resolution"
  short: "The field that records why work on a bug ended, such as Fixed, Duplicate, Won't fix or Cannot reproduce."
  definition: "Status says where the bug is in the workflow; resolution says how it ended. Two closed bugs can have very different resolutions."
  example: "Status: Closed. Resolution: Duplicate (of SHOP-2041)."
  category: bugs
  related: [bug-life-cycle, duplicate-bug]

- id: feature-flag
  term: "Feature flag"
  short: "A switch that turns a feature on or off without releasing a new build."
  definition: "Teams release code hidden behind flags and turn it on for testers, a small percentage of users, or everyone. Testers need to know which flags are on when they test."
  example: "The new checkout is only visible when the 'checkout_v2' flag is enabled for your test account."
  category: process
  aka: ["Feature toggle", "Remote config"]
  related: [devops, release]

- id: hotfix
  term: "Hotfix"
  short: "An urgent fix released outside the normal release schedule."
  definition: "Hotfixes address serious production problems. Testers focus on verifying the fix and a quick targeted regression, because there's little time."
  example: "Payments fail for all Mastercard users, so a hotfix ships the same afternoon."
  category: process
  aka: ["Patch"]
  related: [release, regression-testing]

- id: reopen-rate
  term: "Reopen rate"
  short: "The share of fixed bugs that fail retesting or come back later."
  definition: "A high reopen rate can mean rushed fixes, unclear bug reports or missing regression tests. It's a team health metric, not a way to blame individuals."
  example: "Out of 50 bugs fixed this sprint, 6 were reopened: a 12% reopen rate."
  category: bugs
  related: [bug-life-cycle, retesting]

- id: statement-coverage
  term: "Statement coverage"
  short: "The percentage of code statements executed at least once by the tests."
  definition: "It's the simplest code coverage measure (code coverage is the umbrella term). 100% statement coverage can still miss bugs, because a decision may never take its 'false' path."
  example: "Tests for a discount function run every line, but never the case where no discount applies."
  category: techniques
  aka: ["Line coverage"]
  related: [branch-coverage, white-box-testing]

- id: branch-coverage
  term: "Branch coverage"
  short: "The percentage of decision outcomes (each true and false exit of an if) taken by the tests."
  definition: "Branch coverage is stronger than statement coverage: every if needs at least one test that goes each way."
  example: "An 'if member' check needs one test with a member and one without for full branch coverage."
  category: techniques
  aka: ["Decision coverage"]
  related: [statement-coverage, white-box-testing]

- id: error-guessing
  term: "Error guessing"
  short: "Choosing tests based on experience of typical mistakes developers make."
  definition: "It is one of the experience-based techniques. Experienced testers try inputs like apostrophes in names, double taps, 29 February, empty lists or a phone call mid-payment, because these break apps again and again."
  example: "You type O'Brien in the name field because apostrophes often break sign-up forms."
  category: techniques
  aka: []
  related: [exploratory-testing, edge-case, fault-attack, experience-based-testing]

- id: use-case-testing
  term: "Use case testing"
  short: "Testing a complete user journey, the main path plus its alternative and error paths."
  definition: "A use case describes how a user reaches a goal, like 'buy a train ticket'. Tests follow the main flow and each alternative, such as a sold-out train or a declined card."
  example: "Main path: search, choose seat, pay. Alternatives: seat taken during payment, card declined, session timeout."
  category: techniques
  aka: ["Scenario testing"]
  related: [use-case, test-scenario, black-box-testing]

- id: pairwise-testing
  term: "Pairwise testing"
  short: "Choosing a small set of tests so that every pair of input values appears together at least once."
  definition: "When many options combine (browsers × languages × payment methods), testing all combinations is impossible. Pairwise testing catches most interaction bugs with far fewer tests."
  example: "Instead of 4 × 3 × 5 = 60 combinations, 20 pairwise tests cover every pair of browser, language and payment method."
  category: techniques
  aka: ["All-pairs testing"]
  related: [combinatorial-explosion, decision-table, pict]

- id: combinatorial-explosion
  term: "Combinatorial explosion"
  short: "The rapid growth in the number of combinations as conditions are added."
  definition: "Each yes/no condition doubles the combinations: 3 conditions give 8, 10 give 1,024. Testers use decision tables, pairwise testing and risk to choose a sensible subset."
  example: "A form with 12 optional yes/no settings has 4,096 combinations, far too many to test one by one."
  category: techniques
  related: [pairwise-testing, decision-table]


- id: use-case
  term: "Use case"
  short: "A step-by-step description of how a user reaches one goal with the system, including what can go differently."
  definition: "A use case names the actor, the preconditions, the main success scenario, the alternative and exception flows, and what must be true afterward (postconditions). Testers turn each flow into at least one test scenario."
  example: "'Reorder a previous order' in a food delivery app: the happy path, plus sold-out dishes, a closed restaurant and a declined card."
  category: techniques
  related: [use-case-testing, actor, main-success-scenario, alternative-flow, exception-flow, postcondition]

- id: actor
  term: "Actor"
  short: "Whoever or whatever interacts with the system in a use case: a person, another system or a device."
  definition: "The primary actor is the one who wants the goal (a customer reordering food). Secondary actors help along the way, like a payment provider or an email service. Each actor hints at test data and roles you need."
  example: "In 'Reset password', the primary actor is the customer; the email service is a secondary actor that sends the link."
  category: techniques
  related: [use-case, use-case-testing]

- id: main-success-scenario
  term: "Main success scenario"
  short: "The use case's normal path, where everything goes right and the actor reaches the goal."
  definition: "Also called the basic flow or main flow. It is written as numbered steps that alternate between what the actor does and how the system responds. Extensions (alternative and exception flows) branch off from its steps."
  example: "Open Orders, tap Reorder, check the cart, place the order, see the confirmation."
  category: techniques
  aka: ["Basic flow", "Main flow"]
  related: [use-case, alternative-flow, exception-flow, positive-testing]

- id: alternative-flow
  term: "Alternative flow"
  short: "A different route through a use case that still reaches the goal."
  definition: "Alternative flows branch off a step of the main success scenario when a condition differs, then usually rejoin it. Each one deserves its own test scenario, because developers often code the main path first and the alternatives in a hurry."
  example: "While reordering, two of three dishes are available: the app adds those two, lists the missing one, and the customer still orders."
  category: techniques
  aka: ["Alternate flow"]
  related: [use-case, main-success-scenario, exception-flow]

- id: exception-flow
  term: "Exception flow"
  short: "A route through a use case where an error or condition stops the actor from reaching the goal normally."
  definition: "Exception flows describe how the system handles failures such as a declined card, an expired link or a closed restaurant. Testers check the message, that no half-finished data is left behind, and whether the user can recover. Some teams call alternative and exception flows together 'extensions'."
  example: "The reset link is older than 30 minutes, so the app shows 'This link has expired' and offers to send a new one."
  category: techniques
  aka: ["Error flow"]
  related: [use-case, alternative-flow, negative-testing]

- id: postcondition
  term: "Postcondition"
  short: "What must be true after a use case or test has finished."
  definition: "Preconditions are what must be true before you start; postconditions are the state you check afterward, such as data saved, money charged once or a link no longer working. Checking postconditions catches bugs that a happy confirmation screen hides."
  example: "After a reorder, a new order exists, the card was charged once and the original order is unchanged."
  category: techniques
  related: [precondition, use-case, expected-result]

- id: experience-based-testing
  term: "Experience-based testing"
  short: "Test techniques that rely on the tester's knowledge of where software usually breaks."
  definition: "Error guessing, exploratory testing and checklist-based testing are the classic experience-based techniques. They complement systematic black-box techniques by finding the bugs no requirement mentions."
  example: "A tester who has seen many sign-up forms tries an emoji in the name and a leap-day birthday, without being told to."
  category: techniques
  related: [error-guessing, exploratory-testing, checklist, fault-attack]

- id: fault-attack
  term: "Fault attack"
  short: "A planned, systematic form of error guessing: list likely failures, then design tests to provoke each one."
  definition: "Instead of guessing ad hoc, the tester starts from a list of possible defects or failures (from experience, past bug reports or published lists) and attacks the software to see if they exist. The idea was popularized by James Whittaker's book How to Break Software."
  example: "From a list of upload failures, the tester deliberately denies the camera permission, cuts the network mid-upload and picks a 12 MB photo."
  category: techniques
  aka: ["Software attack"]
  related: [error-guessing, experience-based-testing]

- id: pict
  term: "PICT"
  short: "Pairwise Independent Combinatorial Testing: Microsoft's free command-line tool that generates pairwise test sets."
  definition: "You describe parameters and values in a plain text model file, add constraints for impossible combinations, and PICT prints a small set of test rows that covers every pair. It can also generate higher-order (3-way and more) combinations. It is open source on GitHub."
  example: "A model with Browser, OS, Language and Payment lines produces about 16 to 20 rows instead of 144 combinations."
  category: tools
  related: [pairwise-testing, combinatorial-explosion]

- id: usability-heuristics
  term: "Usability heuristics"
  short: "Broad rules of thumb for good interaction design, most famously Jakob Nielsen's 10 heuristics."
  definition: "Nielsen's 10 usability heuristics (from Nielsen Norman Group) include visibility of system status, user control and freedom, consistency and standards, and error prevention. Evaluators review a screen against them to find problems without needing real users."
  example: "A Delete account button with no confirmation breaks the 'Error prevention' heuristic."
  category: techniques
  aka: ["Nielsen's heuristics", "10 usability heuristics"]
  related: [heuristic-evaluation, usability-testing, heuristic]

- id: heuristic-evaluation
  term: "Heuristic evaluation"
  short: "An expert review where evaluators check an interface against usability heuristics."
  definition: "Several evaluators (Nielsen suggests three to five) inspect the product separately, note every problem with the heuristic it breaks and a severity, then merge their lists. It is fast and cheap, but it predicts problems rather than watching real users hit them, so it complements usability tests."
  example: "Three testers review a new checkout screen in an afternoon and find 14 issues, including missing feedback after Apply coupon."
  category: techniques
  aka: ["Expert review"]
  related: [usability-heuristics, usability-testing]

- id: think-aloud
  term: "Think-aloud protocol"
  short: "A usability test method where participants say what they are thinking while they try tasks."
  definition: "The facilitator asks the participant to keep talking ('I'm looking for... I expected...') and stays neutral, without helping. Hearing expectations and confusion in the user's own words explains why a problem happens, not just that it happens."
  example: "'I'd expect the address to be under Profile... no... maybe Settings?' tells you the option is hard to find."
  category: techniques
  aka: ["Thinking aloud"]
  related: [usability-testing]

- id: sus
  term: "System Usability Scale (SUS)"
  short: "A 10-question questionnaire that gives a usability score from 0 to 100."
  definition: "Created by John Brooke in 1986. Participants rate 10 statements from strongly disagree to strongly agree, and the answers convert to a score from 0 to 100. The score is not a percentage; around 68 is often cited as average. It is useful for comparing versions, not for finding specific problems."
  example: "After a usability round, the redesigned checkout scores 78 on SUS, up from 61 for the old one."
  category: techniques
  aka: ["SUS"]
  related: [usability-testing]

- id: test-oracle
  term: "Test oracle"
  short: "Any source you use to decide whether a result is right or wrong."
  definition: "A spec is the obvious oracle, but testers also compare against the product itself, similar products, user expectations, standards and claims in marketing. When there's no spec, naming your oracle makes a bug report convincing."
  example: "'Expected: 120 beans, the same number the Home screen shows' uses consistency within the product as the oracle."
  category: techniques
  aka: ["Oracle"]
  related: [heuristic, expected-result]

- id: heuristic
  term: "Heuristic"
  short: "A rule of thumb that helps you find problems or make decisions quickly, but can be wrong."
  definition: "Testers use heuristics like 'too small, too big, just right', CRUD, or consistency checks (HICCUPPS) to generate test ideas and judge results. They guide thinking; they don't guarantee answers."
  example: "Using the Goldilocks heuristic, you try 0, 1, a normal amount and 10,000 items in the cart."
  category: techniques
  aka: ["Rule of thumb"]
  related: [test-oracle, exploratory-testing, test-tour]

- id: feature-map
  term: "Feature map"
  short: "A tree or mind map of everything a product does, used to track coverage, risk and questions."
  definition: "Building a feature map while exploring shows what exists, what you've tested and where the risks are. It's especially useful when there's no documentation."
  example: "Rewards → Earn beans → Refunds: marked high risk, one open question for the product owner."
  category: techniques
  aka: ["Mind map"]
  related: [exploratory-testing, risk-based-testing]

- id: risk-based-testing
  term: "Risk-based testing"
  short: "Prioritizing testing by risk: how likely something is to fail and how bad the impact would be."
  definition: "Rate each area's likelihood and impact, then test the highest scores first and deepest. It's how testers decide what to do when there isn't time to test everything."
  example: "Payments are high likelihood (new SDK) and high impact (money), so they're tested first; the 'About' screen comes last."
  category: techniques
  aka: ["Risk-based prioritization"]
  related: [test-plan, priority, impact-analysis]

- id: definition-of-ready
  term: "Definition of Ready"
  short: "The team's agreement on when a story is clear enough to start work on."
  definition: "Typical items: testable acceptance criteria, designs attached, dependencies known, open questions answered. Testers help by asking questions before the sprint starts."
  example: "The story can't enter the sprint because it says 'show an error' without saying which error or when."
  category: agile
  aka: ["DoR"]
  related: [definition-of-done, user-story, acceptance-criteria]

- id: definition-of-done
  term: "Definition of Done"
  short: "The team-wide checklist every story must meet before it counts as finished."
  definition: "It usually includes code review, tests passing, acceptance criteria verified, no open critical bugs and documentation updated. Testers make sure 'done' really means done."
  example: "The developer says the feature is done, but it hasn't been tested on Android, which the Definition of Done requires."
  category: agile
  aka: ["DoD"]
  related: [definition-of-ready, sprint, acceptance-criteria]

- id: three-amigos
  term: "Three amigos"
  short: "A short meeting where product, development and testing review a story together before work starts."
  definition: "It often happens during or just before backlog refinement. Each role brings a different view: what's needed, how to build it, and how it could break. Testers' questions about edge cases often change the story before any code is written."
  example: "In a 15-minute three amigos session, the tester asks what happens to a paused workout after a phone call, and a new criterion is added."
  category: agile
  aka: []
  related: [user-story, acceptance-criteria, shift-left]

- id: gherkin
  term: "Gherkin (Given/When/Then)"
  short: "A structured format for writing acceptance criteria as scenarios: Given a context, When an action, Then a result."
  definition: "Gherkin makes criteria concrete and testable, and tools like Cucumber can even run them as automated tests, a practice called behavior-driven development (BDD). Each scenario reads like a mini test case."
  example: "Given a running workout, When the user taps Pause, Then the timer stops and the button changes to Resume."
  category: agile
  aka: ["Given/When/Then"]
  related: [acceptance-criteria, user-story]

- id: invest
  term: "INVEST"
  short: "A checklist for good user stories: Independent, Negotiable, Valuable, Estimable, Small, Testable."
  definition: "Testers care most about the T: if you can't say how to test a story, it isn't ready. Stories that are too big are also hard to test well."
  example: "'Improve the app' fails INVEST: it isn't small, estimable or testable."
  category: agile
  related: [user-story, definition-of-ready]

- id: session-based-test-management
  term: "Session-based test management"
  short: "Organizing exploratory testing into time-boxed sessions, each with a charter, notes and a debrief."
  definition: "Sessions (often 60–90 minutes) make exploratory work visible and reportable: what was tested, what was found and what's left. The debrief shares results with the team."
  example: "A 90-minute session on the checkout charter ends with 3 bugs, 2 questions and a note that refunds weren't covered."
  category: techniques
  aka: ["SBTM"]
  related: [exploratory-testing, test-charter]

- id: test-tour
  term: "Test tour"
  short: "A themed walk through an app during exploratory testing, like the money tour or the back button tour."
  definition: "Tours give exploration a focus. The money tour follows features that earn revenue; the back button tour presses Back everywhere; the interruptions tour adds calls and notifications."
  example: "On the back button tour you discover that pressing Back after paying shows the Pay screen again, enabled."
  category: techniques
  aka: ["Tour"]
  related: [exploratory-testing, heuristic]

- id: impact-analysis
  term: "Impact analysis"
  short: "Working out which parts of a product a change could affect, to decide what to retest."
  definition: "Testers read the change description, ask developers what code was touched and think about everything that depends on it. The result is a focused regression subset instead of retesting everything."
  example: "A payment SDK update means retesting checkout, refunds, saved cards and order history, but not the profile photo upload."
  category: techniques
  aka: ["Change impact analysis"]
  related: [regression-testing, risk-based-testing]

- id: jql
  term: "JQL"
  short: "Jira Query Language: the field-operator-value syntax for searching Jira issues."
  definition: "JQL lets testers build precise filters, like all open bugs in the current release. Saved filters can power dashboards and notifications."
  example: "project = SHOP AND type = Bug AND status != Done ORDER BY priority DESC"
  category: tools
  aka: ["Jira Query Language"]
  related: [jira, bug-life-cycle]

- id: kanban
  term: "Kanban"
  short: "A way of managing work as a continuous flow across a board, often with limits on work in progress."
  definition: "Unlike Scrum, Kanban has no fixed sprints. Work moves across columns like To do, In progress, In test and Done, and limits stop too much piling up in one column."
  example: "The 'In test' column has a limit of 3, so developers help test before starting new work."
  category: agile
  related: [scrum, jira]

- id: epic
  term: "Epic"
  short: "A large piece of work split into smaller stories and tasks, often spanning several sprints."
  definition: "Epics group related stories, like 'New checkout'. Testers use them to see the bigger picture and plan end-to-end tests across stories."
  example: "The epic 'Apple Pay & Google Pay' contains 6 stories and 14 bugs."
  category: agile
  related: [user-story, jira]

- id: test-management-tool
  term: "Test management tool"
  short: "A tool like TestRail, Xray or Zephyr that stores test cases and records test runs and results."
  definition: "It keeps suites organized, tracks which tests passed on which build, and links test results to stories and bugs."
  example: "The release dashboard shows 182 of 190 regression tests passed on build 318, with 3 failures linked to bugs."
  category: tools
  aka: ["TestRail", "Xray", "Zephyr"]
  related: [test-suite, test-run, test-case-repository, regression-testing, jira]

- id: test-case-repository
  term: "Test case repository"
  short: "The central library where a team keeps all its test cases, organized into sections and suites."
  definition: "The repository holds the master copy of every test case with fields like priority, type and automation status. Cases are written once and reused in many test runs, release after release, so the repository has to be kept up to date when the product changes."
  example: "FoodDash's repository has sections for Login, Cart, Checkout and Tracking. For release 2.0, the tester picks 40 of its 300 cases into a new run."
  category: process
  aka: ["Test repository", "Test case library"]
  related: [test-case, test-suite, test-run, test-management-tool]

- id: test-run
  term: "Test run"
  short: "One execution of a chosen set of test cases on a specific build and environment, with a result for each case."
  definition: "A run is created from cases in the repository, tied to one build and one environment or device, and assigned to testers. As they work, each case gets an execution status. The run is the record of what was actually tested, where, by whom and with what outcome. Tools name it differently: test run, test cycle or test execution."
  example: "\"FoodDash 2.0.0 regression, build 412, iPhone 15 (iOS 18)\": 120 cases, 104 passed, 9 failed, 3 blocked, 4 untested."
  category: process
  aka: ["Test cycle", "Test execution (Xray)"]
  related: [test-execution, execution-status, test-case-repository, test-summary-report]

- id: test-execution
  term: "Test execution"
  short: "The activity of running test cases, comparing actual with expected results and recording the outcome."
  definition: "During execution a tester follows each case, notes the actual result, attaches evidence such as screenshots or logs for anything that isn't a clean pass, sets a status and links a bug report to every failure. In Xray, \"Test Execution\" is also the name of the Jira issue type that holds a run."
  example: "The tester runs TC-202, sees the expired code SPRING5 accepted, marks it Failed, attaches a screen recording and links bug FD-242."
  category: process
  related: [test-run, execution-status, actual-result, bug-report]

- id: execution-status
  term: "Execution status"
  short: "The result recorded for a test case in a run: Passed, Failed, Blocked, Retest, Skipped or Untested."
  definition: "Passed means the actual result matched the expected one. Failed means it didn't, because of a defect in the product. Blocked means the case could not be run because something outside it is broken or missing. Retest means a linked bug was fixed and the case must be run again. Skipped or Not applicable means it was deliberately not run. Untested means nobody has run it yet. Exact names vary between tools."
  example: "Login passed, the coupon case failed, and the card payment case is blocked because the payment sandbox is down."
  category: process
  aka: ["Test status", "Test result"]
  related: [test-run, blocked-test, retesting, test-execution]

- id: blocked-test
  term: "Blocked test"
  short: "A test case that can't be run to the end because something outside it is broken or missing."
  definition: "A test is blocked when you can't reach or complete the thing it checks: the environment is down, test data is missing, or an earlier bug stops you getting there. Blocked is not Failed: nothing was proven wrong about this case's behavior yet. Always write the reason and, where there is one, link the issue that blocks it."
  example: "The card payment case is blocked because the payment provider's sandbox returns 503 errors. It's re-run when the sandbox is back."
  category: process
  aka: ["Blocked"]
  related: [execution-status, blocker, environment, test-run]

- id: critical-user-journey
  term: "Critical user journey"
  short: "An end-to-end path that matters most to users and the business, like sign in, order and pay."
  definition: "Smoke and regression suites are built around critical journeys, because if one breaks, the product effectively doesn't work."
  example: "For a food delivery app: open app, find a restaurant, add to cart, pay, track the order."
  category: process
  aka: ["Critical path", "Key user flow"]
  related: [smoke-testing, regression-testing]


- id: one-time-password
  term: "One-time password (OTP)"
  short: "A short code that works for one login and a short time, sent by SMS or email or generated by an app."
  definition: "OTPs are the most common second factor. Testers check expiry, reuse, resend, wrong attempts and how the code is entered (autofill, paste, leading zeros)."
  example: "A 6-digit code 042917 arrives by SMS; it should expire after 5 minutes and stop working once used."
  category: web
  aka: ["OTP", "Verification code"]
  related: [two-factor-authentication, totp]

- id: totp
  term: "TOTP"
  short: "Time-based one-time password: an authenticator app and the server compute the same code every 30 seconds."
  definition: "Both sides use a shared secret and the current time, so a phone with a wrong clock produces codes the server rejects. Servers usually accept one step either side to allow small differences."
  example: "Google Authenticator shows a new 6-digit code every 30 seconds for your bank account."
  category: web
  aka: ["Authenticator app code"]
  related: [one-time-password, clock-skew]

- id: backup-codes
  term: "Backup codes"
  short: "Single-use recovery codes shown when 2FA is set up, for when the phone is lost."
  definition: "Each code should work exactly once, be shown only at setup (or regenerated with re-authentication) and never be emailed in plain text."
  example: "Using backup code #3 logs you in; using #3 again is rejected."
  category: web
  aka: ["Recovery codes"]
  related: [two-factor-authentication, one-time-password]

- id: clock-skew
  term: "Clock skew"
  short: "The difference between a device's clock and the server's, which breaks time-based features."
  definition: "Wrong device time makes TOTP codes fail, certificates look invalid and timestamps appear in the future. Testers change the device time on purpose to check."
  example: "A phone set 3 minutes behind generates authenticator codes that the server keeps rejecting."
  category: techniques
  aka: ["Time drift"]
  related: [totp, time-zone]

- id: re-authentication
  term: "Re-authentication"
  short: "Asking for the password (or biometrics) again before a sensitive change."
  definition: "Changing email, disabling 2FA or deleting an account should require proving it's really you, even in a logged-in session."
  example: "Before turning off two-factor authentication, the app asks for the current password again."
  category: web
  aka: ["Step-up authentication"]
  related: [authentication, two-factor-authentication]

- id: checkbox
  term: "Checkbox"
  short: "A small square the user ticks to include an option; each one is independent and usually applies on submit."
  definition: "Checkboxes allow zero, one or many selections. Testers check the label is clickable, the mixed state in 'select all', keyboard Space, and required checkboxes like terms acceptance."
  example: "Ticking 'I agree to the terms' enables the Create account button; the label text should toggle it too."
  category: ui
  aka: ["Check box", "Tick box"]
  related: [radio-button, toggle-switch, indeterminate-state]

- id: radio-button
  term: "Radio button"
  short: "A round option in a group where exactly one can be selected; choosing one unselects the others."
  definition: "Radio groups are for a few visible, mutually exclusive options. Testers check grouping, default selection, arrow-key navigation and that the whole row is tappable."
  example: "Standard, Express and Same-day shipping as radio buttons: picking Express unselects Standard and updates the total."
  category: ui
  aka: ["Radio", "Option button"]
  related: [checkbox, mutually-exclusive, segmented-control]

- id: indeterminate-state
  term: "Indeterminate state"
  short: "The 'mixed' state of a parent checkbox, shown as a dash, when only some of its children are checked."
  definition: "A 'Select all' checkbox should show mixed when some items are selected, checked when all are, and empty when none are. Screen readers announce it as 'mixed'."
  example: "You select 2 of 5 emails, so the 'Select all' box shows a dash instead of a tick."
  category: ui
  aka: ["Mixed state", "Partially checked"]
  related: [checkbox]

- id: exif
  term: "EXIF"
  short: "Metadata stored inside a photo: camera, date, orientation and often the exact GPS location."
  definition: "Apps must respect the orientation tag or photos appear sideways, and should usually strip location data before sharing photos publicly."
  example: "A marketplace listing photo still contains the seller's home GPS coordinates in its EXIF data."
  category: mobile
  aka: ["Photo metadata"]
  related: [heic, photo-picker]

- id: heic
  term: "HEIC"
  short: "The high-efficiency image format iPhones use by default; not every server or browser supports it."
  definition: "Uploads need to accept HEIC or convert it, otherwise iPhone users get confusing errors. It belongs in every image upload test kit."
  example: "An iPhone photo upload fails with 'Something went wrong' because the server only accepts JPEG and PNG."
  category: mobile
  aka: ["HEIF"]
  related: [exif]

- id: photo-picker
  term: "Photo picker"
  short: "The system screen for choosing photos, which on iOS and Android can be used without full library permission."
  definition: "Modern pickers let users share selected photos only. Testers check the app works with limited access and doesn't demand full gallery permission unnecessarily."
  example: "The app opens the system photo picker and receives only the 2 photos the user chose."
  category: mobile
  aka: ["Image picker"]
  related: [app-permissions, exif]

- id: flash-of-unstyled-content
  term: "Flash of unstyled content"
  short: "The page briefly shows the wrong styles or theme before the right ones load."
  definition: "A common dark mode bug on the web: the page flashes white before switching to dark, because the theme is applied after the first render."
  example: "Reloading a dark-themed site at night briefly blinds you with a white page."
  category: web
  aka: ["FOUC", "Theme flash"]
  related: [dark-mode]

- id: semantic-color
  term: "Semantic color"
  short: "A named color such as 'label' or 'background' that has a light and a dark value."
  definition: "Using semantic colors instead of hard-coded hex values lets the app adapt to dark mode and high contrast automatically. Hard-coded colors are a top source of dark mode bugs."
  example: "Text using the 'label' color turns white in dark mode; text hard-coded as #111 stays nearly black and becomes invisible."
  category: ui
  aka: ["Design token", "Color token"]
  related: [dark-mode, contrast-ratio]

- id: skeleton-screen
  term: "Skeleton screen"
  short: "A grey placeholder layout shaped like the real content, shown while data loads."
  definition: "Skeletons feel faster than spinners and reduce layout shift. Testers check they're replaced by real content, an empty state or an error, never left on screen forever."
  example: "The orders list shows three grey bars while loading, then the real orders appear in the same places."
  category: ui
  aka: ["Skeleton loader", "Shimmer"]
  related: [loading-state, empty-state]

- id: event-bubbling
  term: "Event bubbling"
  short: "A tap on an inner element is also delivered to its parent elements."
  definition: "If a button sits inside a clickable card, one tap can trigger both unless the developer stops it. It's behind many 'tapping the heart also opens the product' bugs."
  example: "Tapping the favorite heart on a product card adds it to favorites and also opens the product page."
  category: web
  aka: ["Click propagation"]
  related: [button]

- id: stretched-link
  term: "Stretched link"
  short: "A card pattern where one link (usually the title) is made clickable across the whole card."
  definition: "It gives a large tap area with only one link for screen readers, while other buttons in the card still work on their own."
  example: "Tapping anywhere on a restaurant card opens it, and VoiceOver reads it as one link instead of five."
  category: ui
  aka: ["One link per card"]
  related: [event-bubbling, screen-reader]

- id: device-token
  term: "Device token"
  short: "A unique ID that APNs or FCM gives an app on a device; the server uses it to address push notifications."
  definition: "Tokens change on reinstall and sometimes on update. Duplicate or stale tokens cause double notifications or pushes that never arrive."
  example: "After a cold start the app registers its token twice, so every order update arrives twice."
  category: mobile
  aka: ["Push token", "FCM token"]
  related: [push-notification]

- id: permission-priming
  term: "Permission priming"
  short: "Explaining in the app why a permission is needed, at the right moment, before the system dialog."
  definition: "Because iOS shows the system prompt only once, apps prime first and ask in context. Testers check the flow after 'Allow', 'Don't Allow' and later changes in Settings."
  example: "'Turn on order updates so you know when your food arrives' appears before the system notification prompt."
  category: mobile
  aka: ["Pre-permission prompt"]
  related: [app-permissions, push-notification]

- id: scrim
  term: "Scrim"
  short: "The dimmed layer behind a modal or bottom sheet that blocks the page underneath."
  definition: "Tapping the scrim usually means cancel. It must block taps to the page behind; if taps pass through, users trigger actions they can't see."
  example: "Tapping the dimmed area to close the sheet also presses the + button behind it."
  category: ui
  aka: ["Backdrop", "Overlay"]
  related: [modal, bottom-sheet]

- id: detent
  term: "Detent"
  short: "A height a sheet snaps to, like iOS medium (about half the screen) or large (almost full)."
  definition: "Sheets with detents can be dragged between heights. Testers check every detent, small screens, landscape and large text."
  example: "Dragging the delivery-time sheet up snaps it from half height to full height."
  category: mobile
  aka: ["Snap point"]
  related: [bottom-sheet]

- id: nested-scrolling
  term: "Nested scrolling"
  short: "How a scrollable list inside a draggable or scrollable container decides which one moves."
  definition: "Inside a bottom sheet, the list should scroll first and the sheet should only move when the list is at the top. Getting it wrong makes lists impossible to scroll."
  example: "Trying to scroll the time slots drags the whole sheet down instead."
  category: ui
  related: [bottom-sheet, gesture]

- id: bottom-sheet
  term: "Bottom sheet"
  short: "A panel that slides up from the bottom of the screen with extra content or choices."
  definition: "Bottom sheets can be modal (blocking the page) or standard (persistent). Testers check dragging, snap heights, scrolling inside, the keyboard and every way to close it."
  example: "Tapping 'Delivery time' opens a sheet with time slots and a Confirm button."
  category: ui
  aka: ["Sheet"]
  related: [modal, scrim, detent]

- id: tabs
  term: "Tabs"
  short: "A row of labels that switches between related views on the same screen."
  definition: "Tabs should keep each view's state, show which one is active, work with swipe on Android and arrow keys on the web, and fit labels in every language."
  example: "Active · Delivered · Returns tabs on an orders screen, each keeping its own scroll position."
  category: ui
  aka: ["Tab strip", "Tab row"]
  related: [segmented-control, bottom-sheet]

- id: slider
  term: "Slider"
  short: "A control where you drag a thumb along a track to choose a value or a range between a minimum and maximum."
  definition: "Sliders suit approximate values like volume or a price range, not exact ones like age. Testers check min and max are reachable, rounding, keyboard support and what screen readers announce."
  example: "A price filter from €0 to €250 should actually reach €250, not stop at €240."
  category: ui
  aka: ["Range slider", "Seek bar"]
  related: [boundary-value-analysis, floating-point-error]

- id: search-bar
  term: "Search bar"
  short: "A field with a search icon where users type a query; usually with a clear button and a Search key."
  definition: "Testers check the keyboard's Search key, clearing, cancel behavior, auto-capitalization and autocorrect, blank and spaces-only queries, and recent searches."
  example: "Typing 'pizza' and pressing Search on the keyboard shows pizza places; tapping × clears both text and results."
  category: ui
  aka: ["Search field", "Search box"]
  related: [autocomplete, debounce, text-field]

- id: floating-point-error
  term: "Floating-point error"
  short: "Tiny rounding errors because computers can't store some decimals exactly."
  definition: "0.1 + 0.2 gives 0.30000000000000004 in most programming languages. Values must be rounded before display or comparison, especially money and ratings."
  example: "A rating filter shows '★ 3.5000000000000004+', and a 4.8-star product is filtered out at 4.8."
  category: bugs
  aka: ["Rounding error"]
  related: [boundary-value-analysis, slider]

- id: rtl
  term: "Right-to-left (RTL)"
  short: "Languages like Arabic and Hebrew that read right to left; layouts and controls must be mirrored."
  definition: "In RTL, back arrows, sliders, progress bars and swipe directions flip. Testers switch the device language to check mirroring and mixed RTL/LTR text."
  example: "In Arabic, the slider fills from right to left and the back arrow points right."
  category: process
  aka: ["Right to left", "RTL layout"]
  related: [localization, internationalization]


- id: secure-enclave
  term: "Secure Enclave"
  short: "An isolated security area inside Apple's chips that protects biometric data and keys; apps never see its contents."
  definition: "Face ID and Touch ID data never leaves the Secure Enclave. Apps only get a yes/no result and can use keys that are unlocked by it."
  example: "The banking app never receives your face data; it only learns that the Secure Enclave approved the unlock."
  category: mobile
  related: [biometric-authentication, android-keystore]

- id: android-keystore
  term: "Android Keystore"
  short: "Android's system for storing cryptographic keys so apps can use them but not extract them."
  definition: "Keys can require the user to authenticate (fingerprint or PIN) before each use. Adding a new fingerprint can invalidate them, which is a useful test case."
  example: "After adding a new fingerprint, the banking app asks for the password again because its key was invalidated."
  category: mobile
  aka: ["Keystore"]
  related: [biometric-authentication, secure-enclave, keychain]

- id: biometric-lockout
  term: "Biometric lockout"
  short: "The OS turns off biometrics after repeated failed scans until the device passcode is entered."
  definition: "Apps must offer a fallback (app password or device passcode) instead of leaving users stuck."
  example: "After five non-matching faces, Face ID is locked and the app should offer password login."
  category: mobile
  related: [biometric-authentication]

- id: one-time-permission
  term: "One-time permission"
  short: "iOS 'Allow Once' or Android 'Only this time': access that expires soon after the user leaves the app."
  definition: "Apps must check permission status every time instead of remembering an earlier 'yes'."
  example: "Location was allowed once yesterday; today the app should ask again, not assume it still has access."
  category: mobile
  aka: ["Allow once", "Only this time"]
  related: [app-permissions]

- id: purpose-string
  term: "Purpose string"
  short: "On iOS, the text an app must provide explaining why it needs a permission; shown in the system dialog."
  definition: "A missing purpose string can crash the app or block the feature. Testers check the text is present, specific and translated."
  example: "'Snapbite uses your camera so you can add photos of your dish to reviews.'"
  category: mobile
  aka: ["Usage description"]
  related: [app-permissions, permission-priming]

- id: app-tracking-transparency
  term: "App Tracking Transparency"
  short: "The iOS prompt apps must show before tracking users across other companies' apps and websites."
  definition: "If the user declines, the app must still work. Testers check the prompt timing and that denying doesn't break features."
  example: "Declining 'Allow tracking' should only affect ads, not stop the user from ordering food."
  category: mobile
  aka: ["ATT"]
  related: [app-permissions]

- id: universal-link
  term: "Universal Link / App Link"
  short: "An https link that opens the app if installed and the website otherwise."
  definition: "iOS calls them Universal Links and Android App Links. They rely on verification files hosted on the website, so a misconfigured domain opens the browser instead of the app."
  example: "Tapping https://shop.example/order/42 in an email opens the order in the app, or on the website if the app isn't installed."
  category: mobile
  aka: ["App Link"]
  related: [deep-link, deferred-deep-link]

- id: deferred-deep-link
  term: "Deferred deep link"
  short: "A link that survives an app install and opens its target on first launch."
  definition: "If the app isn't installed, the user goes to the store, installs, and then lands on the linked content instead of the home screen."
  example: "An ad for a specific jacket leads to the store, and after install the app opens that jacket."
  category: mobile
  related: [deep-link, universal-link]

- id: service-worker
  term: "Service worker"
  short: "A background script in the browser that can cache a site's files and serve it offline."
  definition: "Service workers are a key part of progressive web apps (PWAs). Testers check offline behavior and that updates actually reach users instead of an old cached version."
  example: "After a release, users still see the old checkout because the service worker served cached files."
  category: web
  aka: []
  related: [cache, offline-mode]

- id: pseudo-localization
  term: "Pseudo-localization"
  short: "Replacing text with longer, accented fake text to find untranslated strings and truncation early."
  definition: "Android and Xcode offer pseudo-locales. Any plain English text that remains is hard-coded, and anything cut off will break in long real languages."
  example: "'[Þļåçé öŕðéŕ !!!]' instead of 'Place order' shows the button is too narrow."
  category: techniques
  aka: ["Pseudo-locale"]
  related: [localization, internationalization, truncation]

- id: in-app-purchase
  term: "In-app purchase"
  short: "Buying digital content or features inside a mobile app, paid through the App Store or Google Play."
  definition: "The store handles payment; the app unlocks the content. Testers use sandbox or license-tester accounts, never real money, and check restore, refunds and subscriptions."
  example: "Buying 'Premium yearly' in the app charges through Google Play and unlocks premium on all the user's devices."
  category: mobile
  aka: ["IAP", "Subscription"]
  related: [entitlement, sandbox-account]

- id: entitlement
  term: "Entitlement"
  short: "The record of what a user has paid for and until when, ideally kept on the server."
  definition: "Apps check entitlements to unlock features. Bugs appear when the entitlement isn't updated after renewal, cancellation or refund."
  example: "Premium should end when the entitlement expires on 15 November, not stay unlocked forever."
  category: mobile
  related: [in-app-purchase]

- id: sandbox-account
  term: "Sandbox account"
  short: "A store test account that makes purchases without real charges."
  definition: "Apple uses Sandbox Accounts and StoreKit testing; Google uses license testers. Subscriptions renew much faster in sandbox, so a month can pass in minutes."
  example: "A tester buys a monthly subscription with a sandbox account and watches it renew every few minutes."
  category: tools
  aka: ["License tester", "Test account"]
  related: [in-app-purchase, staging]

- id: bidi-text
  term: "Bidirectional text"
  short: "Text that mixes right-to-left and left-to-right content, like a phone number inside an Arabic sentence."
  definition: "Numbers, URLs and brand names inside RTL text can appear in the wrong order or jump around. It's a classic RTL test case."
  example: "An Arabic sentence with an order number shows the digits reversed."
  category: process
  aka: ["Bidi"]
  related: [rtl, localization]


- id: chip
  term: "Chip"
  short: "A small interactive element for a filter, an entered value, a suggestion or an action."
  definition: "Chips often sit in a scrollable row above results. Testers check selected states beyond color, scroll hints, removing the right chip and duplicates."
  example: "'Vegan', 'Open now' and 'Under €15' filter chips above a restaurant list."
  category: ui
  aka: ["Tag", "Pill", "Token"]
  related: [segmented-control, checkbox]

- id: stepper
  term: "Stepper"
  short: "A − / + control that changes a small exact number by a fixed step between a minimum and maximum."
  definition: "Testers check the limits, typed values, long-press repeat, rapid taps against the server, and what happens at zero."
  example: "A cart quantity stepper should stop at the 4 items in stock instead of letting you pick 5."
  category: ui
  aka: ["Quantity stepper", "Spin button"]
  related: [boundary-value-analysis, double-submit]

- id: navigation-bar
  term: "Navigation bar"
  short: "The bar at the top (title, back, actions) or bottom (main destinations) of an app screen."
  definition: "iOS and Android use the names differently: iOS calls the top bar a navigation bar and the bottom a tab bar; Material calls the bottom one a navigation bar. Testers check back titles, truncation, safe areas and re-tap behavior."
  example: "Re-tapping the Home tab should scroll the feed back to the top."
  category: ui
  aka: ["App bar", "Tab bar", "Toolbar"]
  related: [tabs, safe-area]

- id: navigation-drawer
  term: "Navigation drawer"
  short: "A panel of destinations that slides in from the side, usually opened by the ☰ (hamburger) button."
  definition: "Drawers hold many or secondary destinations. Testers check focus, scroll lock, closing after navigation, highlighting the current page and edge-swipe conflicts."
  example: "Choosing 'Orders' from the side menu should close the drawer and highlight Orders next time it opens."
  category: ui
  aka: ["Hamburger menu", "Side menu"]
  related: [modal, scroll-lock, focus-trap]

- id: skip-link
  term: "Skip link"
  short: "A link shown on the first Tab press that jumps keyboard users past the header to the main content."
  definition: "Without it, keyboard users must tab through every header link on every page. It's a quick accessibility check on any website."
  example: "Pressing Tab on a news site shows 'Skip to content'; pressing Enter moves focus to the article."
  category: web
  aka: ["Skip to content"]
  related: [keyboard-navigation, wcag]

- id: scroll-lock
  term: "Scroll lock"
  short: "Stopping the page behind a modal, sheet or drawer from scrolling while it's open."
  definition: "Without it, scrolling inside an overlay scrolls the page underneath instead, and users lose their place."
  example: "Scrolling the open menu on a phone moves the product list behind it, which is a bug."
  category: ui
  related: [modal, bottom-sheet, navigation-drawer]

- id: home-indicator
  term: "Home indicator"
  short: "The bar at the bottom of iPhones without a home button; the area around it belongs to the system's go-home gesture."
  definition: "Buttons and tab labels must stay above it (inside the safe area), or users trigger the home gesture instead of the button."
  example: "The 'Checkout' button sits under the home indicator, and swiping it closes the app."
  category: mobile
  related: [safe-area, navigation-bar]

- id: cursor-pagination
  term: "Cursor pagination"
  short: "Fetching the next items after a given item instead of skipping a count of items."
  definition: "Offset paging ('skip 20') shows duplicates or skips items when data changes between pages. Cursor paging ('after item 4821') avoids that, which is why feeds use it."
  example: "A new product added while you browse doesn't push the last item of page 1 onto page 2 again."
  category: web
  aka: ["Keyset pagination"]
  related: [pagination, infinite-scroll]

- id: reduced-motion
  term: "Reduced motion"
  short: "The OS setting, and the prefers-reduced-motion media query, that ask apps to minimize animation."
  definition: "Animations and auto-playing content can cause discomfort. Apps should respect the setting by simplifying or stopping motion. Testers turn it on and check carousels, transitions and parallax."
  example: "With Reduce Motion on, the home carousel starts paused and slides change without a sliding animation."
  category: web
  aka: ["prefers-reduced-motion"]
  related: [wcag, accessibility-testing]

- id: accordion
  term: "Accordion"
  short: "Stacked headers that expand to show or hide their content."
  definition: "Testers check the indicator matches the state, the whole header is clickable, aria-expanded updates, deep links open the right section, and opening doesn't lose the user's place."
  example: "An FAQ where tapping 'Returns' opens its answer and the chevron points up."
  category: ui
  aka: ["Expandable section", "Disclosure", "Collapsible"]
  related: [tabs]

- id: tooltip
  term: "Tooltip"
  short: "A short text label that appears on hover or focus to explain a control."
  definition: "Touch screens have no hover, so tooltips must also work on focus or tap, be dismissible with Esc, and never be the only way to name a button."
  example: "Hovering or tabbing to an ⓘ icon shows 'Fee: €1.50 for transfers under €100'."
  category: ui
  aka: ["Hint"]
  related: [modal, toast, aria]


- id: lightbox
  term: "Lightbox"
  short: "A full-screen viewer that opens a photo from a thumbnail on top of the page."
  definition: "Lightboxes need swipe and arrow-key navigation, zoom, a counter, and a way to close that returns the user to the same thumbnail. Focus must stay inside while it's open."
  example: "Tapping the third listing photo opens it full screen, showing '3 of 12', and closing it returns to the same spot in the grid."
  category: ui
  aka: ["Photo viewer", "Media viewer"]
  related: [modal, focus-trap]

- id: srcset
  term: "srcset"
  short: "An HTML attribute that offers several sizes of one image so the browser downloads the smallest sharp one."
  definition: "Together with the sizes attribute, it lets phones download small thumbnails while large screens get sharper images. Testers check the Network panel for oversized downloads."
  example: "A 400px-wide thumbnail should download a ~40 KB file, not the 4 MB original."
  category: web
  aka: ["Responsive images"]
  related: [lazy-loading, performance-testing]

- id: breadcrumb
  term: "Breadcrumb"
  short: "A row of links showing where a page sits in the site's hierarchy, like Home › Camping › Tents."
  definition: "Breadcrumbs help users move up a level. The current page shouldn't be a link, the trail should match the real hierarchy, and screen readers shouldn't read the separators aloud."
  example: "Home › Camping › Tents › Basecamp Dome 2P, where 'Tents' takes you back to the tent list."
  category: ui
  aka: ["Breadcrumbs", "Breadcrumb trail"]
  related: [navigation-bar]

- id: wizard
  term: "Wizard"
  short: "A long task split into ordered steps with a progress indicator, like a checkout."
  definition: "Each step validates its own fields; Back must keep the data, the indicator must match the visible step, and errors should return the user to the right step."
  example: "Shipping › Delivery › Payment › Review, with 'Step 2 of 4' announced to screen readers."
  category: ui
  aka: ["Multi-step form", "Stepper (steps)"]
  related: [input-validation, state-persistence]

- id: structured-data
  term: "Structured data"
  short: "Machine-readable information, often JSON-LD using schema.org, that describes a page to search engines."
  definition: "It powers rich search results like ratings, prices and breadcrumbs. Testers can validate it with Google's Rich Results Test."
  example: "A product page includes JSON-LD with its name, price and availability, so search results show '€89 · In stock'."
  category: web
  aka: ["Schema.org", "JSON-LD"]
  related: [breadcrumb]

- id: file-signature
  term: "File signature"
  short: "The first bytes of a file that reveal its real type, regardless of the extension."
  definition: "Servers check the signature (sometimes called the magic number) because a file's name and extension are easy to fake. A renamed .exe still starts with 'MZ', not with a PDF or JPEG signature."
  example: "A file named invoice.pdf is rejected because its first bytes show it's actually a ZIP archive."
  category: web
  aka: ["Magic number"]
  related: [mime-type, security-testing]

- id: mime-type
  term: "MIME type"
  short: "A label like image/jpeg or application/pdf that says what kind of data a file or response contains."
  definition: "Browsers and servers use MIME types to decide how to handle files. Wrong MIME types cause downloads instead of previews, or rejected uploads."
  example: "An upload form accepts application/pdf, but the server returns PDFs as text/plain, so they display as gibberish."
  category: web
  aka: ["Content type", "Media type"]
  related: [file-signature, http-status-code]

- id: virtualization
  term: "Virtualization (lists)"
  short: "Rendering only the list rows near the screen to keep very long lists fast."
  definition: "Feeds and tables with thousands of rows recycle a small number of row elements as you scroll. Testers check scrolling speed, jumping, and that find-in-page or screen readers still work."
  example: "A 10,000-item order history stays smooth because only about 20 rows exist in the page at any time."
  category: web
  aka: ["List virtualization", "Windowing"]
  related: [infinite-scroll, performance-testing]

- id: sql
  term: "SQL"
  short: "The language used to read and change data in relational databases, like SELECT * FROM orders."
  definition: "SQL (Structured Query Language, said \"S-Q-L\" or \"sequel\") is how people and programs talk to databases such as PostgreSQL, MySQL, SQL Server and SQLite. Testers mostly use it to read data: to check what the app really saved, find test data and investigate bugs."
  example: "After placing an order in the app, a tester runs SELECT * FROM orders WHERE id = 1007 to confirm the total and status were saved correctly."
  category: tools
  aka: ["Structured Query Language"]
  related: [database, query, join, sql-injection]

- id: database
  term: "Database"
  short: "An organized store of an app's data, such as users, orders and payments, kept on a server."
  definition: "Most apps keep their data in a relational database: a set of tables linked by keys. The screens you test are just a view of this data, so checking the database tells you whether the app really saved what it showed."
  example: "The app says \"Order placed\", but the orders table has no new row. The bug is in saving, not in the screen."
  category: web
  aka: ["DB"]
  related: [table, sql, primary-key, foreign-key]

- id: table
  term: "Table (database)"
  short: "A set of rows and columns in a database that holds one kind of thing, like users or orders."
  definition: "Each row is one record (one user, one order) and each column is one property (email, total, status). Every column has a type, such as text, integer or date, and may or may not allow empty (NULL) values."
  example: "The users table has columns id, name, email and city, with one row per registered user."
  category: web
  aka: ["Database table"]
  related: [database, primary-key, null-value]

- id: query
  term: "Query"
  short: "A request to a database, written in SQL, that returns or changes data."
  definition: "A SELECT query reads data and changes nothing. INSERT, UPDATE and DELETE change data, so testers run them only on their own test database, never on shared or production data without permission."
  example: "SELECT name, email FROM users WHERE city IS NULL lists the users who have no city saved."
  category: tools
  aka: ["SQL query", "Statement"]
  related: [sql, database, join]

- id: primary-key
  term: "Primary key"
  short: "A column (usually id) whose value uniquely identifies each row in a table."
  definition: "No two rows can share a primary key and it can't be empty. Other tables point to a row by storing its primary key, which is how orders know which user placed them."
  example: "Order 1007 is the only row in orders with id = 1007, even if two orders have the same total and date."
  category: web
  aka: ["PK"]
  related: [foreign-key, table, database]

- id: foreign-key
  term: "Foreign key"
  short: "A column that points to the primary key of a row in another table, like orders.user_id → users.id."
  definition: "Foreign keys link tables together and are what you join on. If the database doesn't enforce them, you can get orphan rows: records that point to something that no longer exists. Testers look for these after deletes and migrations."
  example: "An order item with order_id = 1016 when there is no order 1016 is an orphan row, usually caused by deleting an order but not its items."
  category: web
  aka: ["FK"]
  related: [primary-key, join, table]

- id: join
  term: "JOIN (SQL)"
  short: "Combining rows from two tables that belong together, for example each order with its customer."
  definition: "An INNER JOIN keeps only rows that have a match in both tables. A LEFT JOIN keeps every row from the left table and fills the missing side with NULL, which is how testers find records that are missing their partner, such as orders without items."
  example: "orders LEFT JOIN order_items, keeping rows where the item side is NULL, lists every order that has no items."
  category: tools
  aka: ["INNER JOIN", "LEFT JOIN"]
  related: [sql, foreign-key, null-value]

- id: null-value
  term: "NULL"
  short: "A database marker for \"no value\" or \"unknown\". It's not zero and not an empty string."
  definition: "NULL behaves differently from normal values: nothing is equal to NULL (not even NULL), so you must write IS NULL or IS NOT NULL. Conditions like city <> 'Berlin' also skip rows where city is NULL, a common source of wrong counts."
  example: "WHERE coupon_id = NULL returns zero rows without any error. WHERE coupon_id IS NULL returns the orders placed without a coupon."
  category: web
  aka: [NULL value]
  related: [table, sql, join]
- id: applicant-tracking-system
  term: Applicant tracking system (ATS)
  short: Software companies use to collect, search, filter and track job applications.
  definition: >-
    An applicant tracking system stores every application a company receives and lets recruiters
    search and filter candidates, often by keywords and by answers to screening questions. It also
    tracks where each candidate is in the hiring process. Because recruiters search it like a search
    engine, a CV that lacks the job ad's key terms may never be seen by a person.
  example: >-
    A recruiter searches the ATS for "mobile testing" and "Jira". A CV that only says "quality checks
    on apps" doesn't appear in the results, even though the candidate has done that work.
  category: process
  aka: [ATS]
  related: [take-home-assignment, qa-portfolio]
- id: take-home-assignment
  term: Take-home assignment
  short: A practical hiring task you complete on your own time, such as testing an app and sending bug reports.
  definition: >-
    A take-home assignment is a practical task in a hiring process that the candidate does
    independently within a deadline, for example "test our website's checkout and send bug reports
    and a short summary within 48 hours". Reviewers look at how well the candidate follows the
    instructions, prioritizes by risk, writes reproducible reports and communicates what was and
    wasn't tested.
  example: >-
    A candidate gets a staging link and 48 hours, spends about four hours testing, and sends a summary
    on top, bug reports sorted by severity, and a "Not tested, and why" section.
  category: process
  aka: [Take-home task, Home assignment, Test assignment]
  related: [bug-report, severity, test-summary-report, staging]
- id: qa-portfolio
  term: QA portfolio
  short: A small public collection of your testing work, such as a test plan, test cases and bug reports.
  definition: >-
    A QA portfolio is a page or repository, often on GitHub or Notion, that shows samples of a
    tester's work so employers can see it before an interview. For people without testing experience it
    usually holds practice-project artifacts: a test plan, test cases, bug reports and exploratory
    session notes. It must never contain confidential material such as take-home assignments or
    employer data.
  example: >-
    A career changer's GitHub repository with a one-page test plan, eight test cases and three bug
    reports from a practice food delivery app, plus links to issues they filed in an open-source project.
  category: process
  aka: [Testing portfolio]
  related: [test-plan, test-case, bug-report]
- id: istqb
  term: ISTQB
  short: The International Software Testing Qualifications Board, which defines a widely used scheme of testing certifications.
  definition: >-
    ISTQB is a non-profit organization that publishes syllabi and exam rules for software testing
    certifications, from Foundation Level to Advanced and specialist modules. Exams are run through
    national member boards and accredited exam providers. Its syllabi and glossary are free to
    download from istqb.org.
  example: >-
    A job ad for a consultancy asks for "ISTQB Foundation Level (CTFL) or willingness to obtain it".
  category: process
  aka: [International Software Testing Qualifications Board]
  related: [ctfl]
- id: ctfl
  term: CTFL (ISTQB Foundation Level)
  short: ISTQB's entry-level testing certificate, the Certified Tester Foundation Level.
  definition: >-
    CTFL is the Certified Tester Foundation Level, the entry-level certificate in the ISTQB scheme.
    The current syllabus is version 4.0, released in 2023, with six chapters: Fundamentals of
    Testing, Testing Throughout the Software Development Lifecycle, Static Testing, Test Analysis and
    Design, Managing the Test Activities, and Test Tools. The exam is multiple choice; whether
    employers value it varies by country and company.
  example: >-
    A new tester studies the free syllabus and sample exams for a few weeks and passes the CTFL exam,
    which helps them get past the CV filter at an outsourcing company.
  category: process
  aka: [ISTQB Foundation, Certified Tester Foundation Level]
  related: [istqb, static-testing, equivalence-partitioning, boundary-value-analysis]
- id: jwt
  term: "JWT"
  short: "JSON Web Token: a signed token with three base64url parts (header, payload, signature) that APIs use to identify the caller."
  definition: >-
    A JWT carries claims such as the user id (sub), the role and the expiry time (exp). The header and payload are only
    encoded, not encrypted, so anyone holding the token can decode and read them. Only the server can verify the
    signature, so decoding a token proves nothing about whether it's genuine.
  example: >-
    Decoding Anna's token shows "sub": "u_1001", "role": "customer" and an exp 50 minutes from now. Changing the role
    to admin breaks the signature, and the API must answer 401.
  category: web
  aka: ["JSON Web Token"]
  related: [bearer-token, authentication, session-token]
- id: bearer-token
  term: "Bearer token"
  short: "An access token sent as Authorization: Bearer <token>; whoever holds it is treated as the user."
  definition: >-
    After login, the server issues an access token that the app sends on every request in the Authorization header.
    Like a ticket, it isn't tied to a face: anyone who has it can use it until it expires or is revoked. Testers check
    that missing, invalid and expired tokens get 401 and that tokens are masked in bug reports.
  example: >-
    GET /v1/users/me with "Authorization: Bearer eyJhbGci..." returns Anna's profile; without the header it returns 401.
  category: web
  aka: ["Access token"]
  related: [jwt, authentication, refresh-token]
- id: refresh-token
  term: "Refresh token"
  short: "A longer-lived token used only to get a new access token when the old one expires."
  definition: >-
    Access tokens are short-lived so a stolen one stops working soon. A refresh token lets the app get a new access
    token without asking the user to log in again. It must stop working after logout, and with rotation each refresh
    returns a new refresh token and invalidates the old one.
  example: >-
    After logging out of the banking app, replaying the old POST /auth/refresh request must return 401.
  category: web
  related: [bearer-token, jwt, session]
- id: api-key
  term: "API key"
  short: "A fixed secret string that identifies an app or partner calling an API, usually sent in a header."
  definition: >-
    API keys identify applications rather than individual users, for example a restaurant's ordering system that
    updates its menu. Testers check that missing, wrong and revoked keys are rejected with 401, that one partner's key
    can't touch another partner's data, and that keys never appear in URLs, responses or logs.
  example: >-
    A request with "x-api-key: test_pk_..." updates Partner 42's menu; the same request with Partner 43's key returns 403.
  category: web
  related: [authentication, bearer-token]
- id: json-schema
  term: "JSON Schema"
  short: "A JSON document that describes what valid JSON looks like: fields, types, required properties and allowed values."
  definition: >-
    Teams use JSON Schema (often generated from an OpenAPI file) to check API responses automatically. A schema test
    catches renamed or missing fields, wrong types and unexpected fields that a status-code check would miss. Postman
    can validate a response with pm.response.to.have.jsonSchema(schema).
  example: >-
    A schema that requires "total" to be a number fails when an endpoint suddenly returns "total": "24.99".
  category: tools
  related: [openapi, json, contract-testing]
- id: etag
  term: "ETag"
  short: "A version label the server sends with a response so clients can ask 'has this changed?' and get 304 if not."
  definition: >-
    The client sends the ETag back in an If-None-Match header. If the resource hasn't changed, the server answers
    304 Not Modified with an empty body and the client uses its cached copy. With If-Match on an update, a stale ETag
    gets 412 Precondition Failed, which prevents lost updates. Testers check that the ETag changes when the data changes.
  example: >-
    A restaurant's menu returns ETag "r3-v3". Sending If-None-Match: "r3-v3" returns 304 until the menu is edited.
  category: web
  aka: ["Entity tag"]
  related: [cache]
- id: idempotency-key
  term: "Idempotency key"
  short: "A unique value the client sends with a request so the server can recognize a retry and not repeat the action."
  definition: >-
    POST requests aren't idempotent, so a retry after a lost response could create a second order or payment. With an
    Idempotency-Key header, the server stores the first response and returns it again for the same key. Payment APIs
    such as Stripe use this pattern, and there is an IETF draft standard for the header.
  example: >-
    The app sends POST /orders twice with Idempotency-Key: order-001 after a timeout; both responses show order 1046
    and only one order exists.
  category: web
  related: [idempotency, double-submit, retry-backoff]
- id: mass-assignment
  term: "Mass assignment"
  short: "A bug where an API saves every field from the request body, including ones the user must not change."
  definition: >-
    If the server copies the whole request body into the database, a user can add fields like "role": "admin" or
    "balance": 9999 to a normal profile update. Protected fields must be ignored or rejected. Test only on test
    environments with permission.
  example: >-
    PATCH /users/me with {"name": "Ana", "role": "admin"} returns 200, and a follow-up GET shows role: admin.
  category: bugs
  related: [broken-access-control, authorization, input-validation]
- id: api-versioning
  term: "API versioning"
  short: "Keeping several versions of an API (such as /v1 and /v2) so old apps keep working after breaking changes."
  definition: >-
    Removing or renaming fields, changing types or making a field required are breaking changes, so they go into a new
    version while the old one keeps working for apps that haven't updated. Testers run the old version's tests on every
    release and try the oldest supported app version against the new back end.
  example: >-
    The 2025 FoodDash app still calls /v1/orders after /v2 renames "total" to "amount"; v1 must keep returning "total".
  category: web
  aka: ["Backward compatibility"]
  related: [contract-testing, semantic-versioning, forced-update]
- id: crud
  term: "CRUD"
  short: "Create, Read, Update, Delete: the four basic operations on stored data."
  definition: >-
    In a REST API, CRUD usually maps to POST, GET, PUT or PATCH, and DELETE. Testers chain them: create an item, read
    it back, update it, read again, delete it and confirm a final read returns 404.
  example: >-
    POST /addresses → 201 with id 31; GET /addresses/31 → 200; PATCH → 200; DELETE → 204; GET /addresses/31 → 404.
  category: web
  related: [http-method, api, endpoint]
- id: oauth
  term: "OAuth 2.0"
  short: "A standard that lets an app get limited access to a user's data on another service without seeing their password."
  definition: >-
    OAuth 2.0 is an authorization framework: the user approves access, and the app receives an access token limited
    by scopes. "Sign in with Google" adds OpenID Connect on top of OAuth to also tell the app who the user is. Testers
    usually test the result: the login flow, the token's scopes, and that endpoints refuse tokens without the needed scope.
  example: >-
    A fitness app asks for permission to read your steps from another service, but not your contacts; its token only
    has the steps scope.
  category: web
  aka: ["OAuth", "OpenID Connect"]
  related: [social-login, authorization, bearer-token]
- id: client-side-validation
  term: Client-side validation
  short: "Checks that run in the app or browser before data is sent, to give the user quick feedback."
  definition: >-
    Client-side validation checks required fields, formats and lengths on the device, so users see
    mistakes immediately without waiting for the server. It improves the experience but can't be trusted:
    anyone can skip it by calling the API directly, editing the request or using an old app version.
    That's why the same rules must also exist on the server.
  example: >-
    A sign up form shows "Enter an email like name@example.com" as soon as you leave the field,
    before anything is sent to the server.
  category: web
  aka: [Front-end validation]
  related: [server-side-validation, input-validation, inline-validation]
- id: server-side-validation
  term: Server-side validation
  short: "Checks the server runs on every request, no matter which app or tool sent it. The only validation you can trust."
  definition: >-
    The server repeats the app's rules and adds checks only it can do, such as "email already registered",
    stock levels or rate limits. If the data is invalid it answers with an error (often 400 or 422) and saves
    nothing. Testers check it by sending invalid data straight to the API, around the app.
  example: >-
    The app blocks users under 18, but a tester sends a sign up request from Postman with a 2012 date of birth.
    The server must reject it with a validation error.
  category: web
  aka: [Back-end validation]
  related: [client-side-validation, input-validation, api]
- id: inline-validation
  term: Inline validation
  short: "Showing a field's error right next to it as the user fills in the form, instead of only after submit."
  definition: >-
    Inline validation checks a field when the user leaves it (on blur) or while typing, and shows the message
    next to that field. Done well, it waits until the user has finished and clears the error as soon as the value
    is fixed. Done badly, it shouts "invalid" after the first letter.
  example: >-
    After leaving the postcode field with "SW1A", the user sees "Enter a full postcode, like SW1A 1AA"
    right under it, and the message disappears once they type the rest.
  category: ui
  aka: [Live validation, Real-time validation]
  related: [input-validation, error-message, client-side-validation]
- id: autofill
  term: Autofill
  short: "When the browser, phone or a password manager fills form fields with saved data in one tap."
  definition: >-
    Autofill uses hints on each field (autocomplete on the web, textContentType on iOS, autofillHints on
    Android) to know what to put where: name, email, address, password, one-time code. Wrong or missing hints
    put values in the wrong fields or offer nothing. Autofilled values must also pass validation.
  example: >-
    Tapping a saved contact above the keyboard fills name, email and address, but the city ends up in the
    postcode field because that field has the wrong autocomplete token.
  category: ui
  aka: [Auto-fill]
  related: [password-manager, autocomplete, text-field]
- id: error-summary
  term: Error summary
  short: "A box at the top of a form listing every problem after a failed submit, each linking to its field."
  definition: >-
    On long forms, an error summary tells users how many problems there are and where. After submit, focus moves
    to the summary so screen readers announce it, and each item is a link that moves focus to the field.
    It complements, not replaces, the message next to each field.
  example: >-
    "There are 2 problems: Enter your date of birth. Accept the Terms to continue." Tapping the first line jumps
    to the Day box.
  category: ui
  aka: [Validation summary]
  related: [error-message, screen-reader, focus-order]
- id: input-mask
  term: Input mask
  short: "A field that formats what you type automatically, like adding spaces to a card number or slashes to a date."
  definition: >-
    Input masks help users enter structured data, but they often break paste, autofill, deleting and
    international formats. Testers check that pasting a full value works, that the mask fits every supported
    country, and that the saved value is clean.
  example: >-
    A phone field forces the US format (555) 555-1234, so a UK number can't be entered and pasting
    "+44 7700 900123" turns into nonsense.
  category: ui
  aka: [Formatted input]
  related: [text-field, input-validation, autofill]
- id: plus-addressing
  term: Plus addressing
  short: "Adding +something before the @ in an email address, like anna+shop@mail.com. Mail still reaches anna@mail.com."
  definition: >-
    Many email providers deliver mail for name+tag@domain to name@domain, so people use tags to filter mail and
    see who shares their address. These addresses are valid, but forms often reject the plus sign by mistake.
  example: >-
    Maya signs up as maya+groceries@mail.com and the form says "Enter a valid email address".
  category: web
  aka: [Subaddressing, Plus sign email]
  related: [input-validation, edge-case]
- id: test-estimation
  term: "Test estimation"
  short: "Forecasting how much effort and time testing will take, usually as a range with assumptions."
  definition: >-
    A test estimate covers understanding the requirement, test design, environment and data setup, execution on every
    device or browser, bug reporting, retest and regression, reporting and a buffer for blockers. It is a forecast, not a
    promise, and it is updated when scope or assumptions change.
  example: >-
    "Testing scheduled orders is about five days, three to eight, assuming the build is on staging Monday."
  category: process
  aka: ["Testing estimate", "Effort estimation"]
  related: [three-point-estimation, work-breakdown-structure, test-plan, risk-based-testing]
- id: three-point-estimation
  term: "Three-point estimation"
  short: "Estimating a task with an optimistic, a most likely and a pessimistic value, often combined with the PERT formula."
  definition: >-
    Instead of one number, each task gets O (optimistic), M (most likely) and P (pessimistic). The PERT formula
    (O + 4M + P) / 6 gives a weighted expected value, and the sums of O and P give a range for the whole job.
  example: >-
    Test design takes 3 h at best, 4 h most likely and 7 h at worst: (3 + 16 + 7) / 6 ≈ 4.3 h.
  category: techniques
  aka: ["PERT estimate", "Three-point estimate"]
  related: [test-estimation, work-breakdown-structure]
- id: work-breakdown-structure
  term: "Work breakdown structure"
  short: "Splitting a job into small tasks that can be estimated and tracked one by one."
  definition: >-
    A work breakdown structure (WBS) lists the tasks needed to finish a piece of work, each small enough to picture
    (roughly an hour to a day). Estimating the tasks and adding them up is more accurate than guessing one big number.
  example: >-
    "Test the tipping feature" becomes: read the story, design cases, set up test data, run on iPhone, run on Android,
    report bugs, retest and regression, write the summary.
  category: process
  aka: ["WBS", "Work breakdown"]
  related: [test-estimation, three-point-estimation]
- id: planning-poker
  term: "Planning poker"
  short: "A team estimation game where everyone reveals a story-point card at once, then discusses the differences."
  definition: >-
    Each team member picks a card (often 1, 2, 3, 5, 8, 13) for a user story. Cards are shown together so nobody anchors
    on the first opinion; the highest and lowest explain their reasoning and the team votes again.
  example: >-
    Developers say 3, the tester says 8 because the story needs four devices and a payment sandbox, and the team agrees on 5 after discussing it.
  category: agile
  aka: ["Scrum poker"]
  related: [story-points, scrum, user-story]
- id: story-points
  term: "Story points"
  short: "A relative measure of the size of a user story, including complexity, effort and uncertainty."
  definition: >-
    Story points compare stories with each other instead of counting hours. In most teams they cover all the work to
    finish a story, including testing.
  example: "A story estimated at 8 points is expected to be roughly as big as two 3-point stories plus some uncertainty."
  category: agile
  related: [planning-poker, sprint, user-story]
- id: git
  term: "Git"
  short: "The version control system most software teams use to track every change to their code."
  definition: >-
    Git records each change (a commit) with its author, date and message, and lets many people work in parallel on
    branches. Websites like GitHub, GitLab and Bitbucket host Git repositories and add pull requests and pipelines.
  example: "A developer's commit message 'Use current menu prices when reordering (FD-327)' links the code change to the bug."
  category: tools
  aka: ["Version control"]
  related: [commit, branch, pull-request, continuous-integration]
- id: commit
  term: "Commit"
  short: "One saved change to the code, with a unique ID (hash), an author and a message."
  definition: >-
    Builds are made from commits, so the commit hash is the most precise answer to "is this fix in my build?".
    Hashes are long but usually shown shortened to 7 characters.
  example: "Build 412 was made from commit 7f3d0b1, which includes the fix from a1c9e2f."
  category: tools
  related: [git, branch, build]
- id: branch
  term: "Branch"
  short: "A separate line of work in a repository, so a change can be built without affecting everyone else."
  definition: >-
    Teams commonly use main (shared latest code), feature or fix branches (one piece of work), release branches
    (a version being stabilized) and hotfix branches (urgent fixes to what's live). Conventions differ between teams.
  example: "The fix for FD-327 lives on fix/FD-327-reorder-prices until it's merged into main."
  category: tools
  related: [git, pull-request, merge, release]
- id: pull-request
  term: "Pull request"
  short: "A request to merge a branch's changes, with code review and automated checks. GitLab calls it a merge request."
  definition: >-
    The pull request page shows the changed lines, reviewers' comments and CI results. Some teams build a test version
    of every pull request so testers can check a change before it's merged.
  example: "PR #418 changes the price calculation; its checks are green and a teammate approved it."
  category: tools
  aka: ["PR", "Merge request", "MR"]
  related: [branch, merge, code-review, continuous-integration]
- id: code-review
  term: "Code review"
  short: "Teammates reading a code change and approving it or asking for changes before it's merged."
  definition: >-
    Code review happens in a pull request. It catches mistakes early and spreads knowledge. Testers rarely review code,
    but the PR's description and changed files are a good hint about what to test.
  example: "The reviewer asks how the reorder fix handles a dish that's no longer on the menu."
  category: process
  related: [pull-request, static-testing, review]
- id: merge
  term: "Merge"
  short: "Bringing the commits from one branch into another, usually into main after a pull request is approved."
  definition: >-
    After a merge, the next build of the target branch contains the change. When two branches changed the same lines,
    a developer has to resolve a merge conflict by hand.
  example: "PR #418 was merged as commit 7f3d0b1, so the next staging build, 412, contains the fix."
  category: tools
  aka: ["Merge conflict"]
  related: [branch, pull-request, build]
- id: pipeline
  term: "Pipeline"
  short: "The automated sequence of stages a code change goes through, from build to tests to deployment."
  definition: >-
    A typical CI/CD pipeline builds the code, runs unit tests and lint, deploys to a test environment, runs automated
    API and UI tests and prepares a release. A red pipeline means a stage failed; the log says which one and why.
  example: "PR #418's pipeline is red because one UI test timed out waiting for map tiles."
  category: tools
  aka: ["CI pipeline", "CI/CD pipeline"]
  related: [continuous-integration, continuous-delivery, flaky-test, build]
- id: continuous-delivery
  term: "Continuous delivery / deployment (CD)"
  short: "Delivery keeps every passing build ready to release; deployment releases every passing change automatically."
  definition: >-
    With continuous delivery a person decides when to release. With continuous deployment every change that passes the
    pipeline goes to production without a human step. Mobile apps rarely do the latter because of store review.
  example: "The web shop deploys to production automatically after the pipeline passes; the app is submitted to the stores by hand."
  category: process
  aka: ["CD"]
  related: [continuous-integration, pipeline, release, devops]
