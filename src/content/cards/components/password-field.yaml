teaser: "Sign-up said your password was fine. Login says it's wrong. Same password, same app. How?"
cards:
  - type: flip
    front: "What's silent truncation in a password field?"
    back: "One form cuts the password without telling you. Sign-up saves 20 characters, login sends only 16, so the right password never works."
  - type: spotbug
    screen: ["Sign up: Blue-Kettle-Sings-42 ✓", "Log in: Blue-Kettle-Sing", "Email or password is incorrect"]
    bug: "The login field cuts the password at 16 characters."
    explain: "Each form works alone. Test the same long password on sign-up, login, change and reset to catch mismatched limits."
  - type: thisorthat
    prompt: "The product owner wants to block paste in the password field for security."
    left: "Block paste"
    right: "Allow paste"
    answer: right
    explain: "Blocking paste breaks password managers and pushes people to short passwords. It adds no real protection."
  - type: quiz
    q: "Which autocomplete value belongs on a sign-up password field?"
    options: ["current-password", "new-password", "off"]
    answer: 1
    explain: "new-password makes managers suggest and save a strong password. current-password is for login; off makes behavior unpredictable."
  - type: truefalse
    statement: "A strength meter that rates Password1! as Strong is working correctly."
    answer: false
    explain: "Password1! is one of the most common passwords. Meters should weigh length and check lists of common passwords, not count character types."
  - type: quiz
    q: "What should a screen reader say on the eye icon next to a password?"
    options: ["Button", "Show password, button", "Eye"]
    answer: 1
    explain: "The toggle needs a name for its action and a state: Show password becomes Hide password, or a pressed state."
  - type: spotbug
    screen: ["Password: Secret", "Tap 👁 Show", "Keep typing 123", "Field: 123Secret"]
    bug: "Revealing the password moved the cursor to the start."
    explain: "Show/hide must keep the value, focus and cursor position. Otherwise users save a different password than they think."
  - type: flip
    front: "When should password rules be shown?"
    back: "Before the user types, then ticked off live. Not as a surprise after the first failed attempt."
  - type: thisorthat
    prompt: "Sign-up trims a trailing space from the password. Login doesn't."
    left: "Fine"
    right: "Bug"
    answer: right
    explain: "Same password, different values: login fails. Spaces must be handled the same way on every form."
  - type: tip
    title: "Check the request"
    text: "Open DevTools or a proxy and log in. The password belongs in a POST body, never in a URL, analytics event or log."
