teaser: "A password reset link is a key to the whole account, no old password needed. How long should that key keep working?"
cards:
  - type: spotbug
    screen: ["Forgot password?", "Email: nobody@test.com", "[ Send reset link ]", "No account uses this email."]
    question: "What's risky about this message?"
    bug: "It reveals whether the email has an account."
    explain: "That's account enumeration. Show the same message for every email: 'If an account exists, we've sent a link.'"
  - type: flip
    front: "What makes a reset link safe?"
    back: "A long random token that expires after a short time, works only once, and points to the production domain over https."
  - type: quiz
    q: "Reset links should expire after 30 minutes. Which test checks this best?"
    options: ["Open it right away", "Open links at about 29 and 31 minutes", "Open it next week"]
    answer: 1
    explain: "Boundary value analysis works for time too. Just before and just after the limit is where wrong-unit bugs hide."
  - type: truefalse
    statement: "If two reset links were requested, only the newest may ever work."
    answer: false
    explain: "Some products cancel older links, others keep all unexpired links valid. It must match the spec, and a used link must never work again."
  - type: spotbug
    screen: ["Subject: Reset your password", "Hi Maya,", "Your current password is Morning5k!", "Reset: staging.pulsefit-dev.net/…"]
    bug: "Password in the email and a staging link."
    explain: "Passwords must never be emailed, and a visible password suggests it isn't hashed. The link must point to production, not a test environment."
  - type: thisorthat
    prompt: "Maya resets her password after her laptop was stolen. The laptop is still logged in afterwards."
    left: "Expected"
    right: "Security bug"
    answer: right
    explain: "A reset is often the answer to a compromised device. If the spec says other sessions end, a surviving session lets the thief keep access."
  - type: quiz
    q: "After a successful reset, what should happen to the old password?"
    options: ["It stops working everywhere", "It works for 24 more hours", "It works on the website only"]
    answer: 0
    explain: "If the old password still logs in anywhere, the reset didn't protect the account at all. Test it on every platform."
  - type: flip
    front: "Why send a 'password changed' email?"
    back: "So the real owner notices if someone else reset their password, and can secure the account quickly."
  - type: thisorthat
    prompt: "You tap the reset link in the Mail app. The phone has the app installed, but the browser opens."
    left: "Report a bug"
    right: "Fine, it's a link"
    answer: left
    explain: "On mobile, a deep link should open the app's reset screen when it's installed. The website is the fallback when the app is missing."
  - type: tip
    title: "Check the real link"
    text: "Don't trust the button text. Long-press it on mobile or hover on desktop to see the actual URL and its environment."
